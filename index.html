<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course 3D · 互动技术课程</title>
<style>
:root{color-scheme:light;--bg:#f6f8fc;--paper:#fff;--ink:#18253a;--muted:#64748b;--line:#dce4ef;--blue:#345de2}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f1626;--paper:#172033;--ink:#e8eefb;--muted:#9aa8c2;--line:#2b3854;--blue:#8aa6ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:760px;margin:0 auto;padding:56px 16px}
h1{font-size:30px;margin:0 0 6px;letter-spacing:-.4px}
p.lead{color:var(--muted);margin:0 0 32px}
a.card{display:block;margin-bottom:16px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 22px;text-decoration:none;color:inherit}
a.card:hover,a.card:focus-visible{border-color:var(--blue)}
a.card b{font-size:19px}
a.card span{display:block;color:var(--muted);font-size:14px;margin-top:6px}
a.card em{font-style:normal;color:var(--blue);font-size:14px;font-weight:700}
</style>
</head>
<body>
<main>
<h1>Course 3D</h1>
<p class="lead">用动画和故障场景，把技术讲得直观一些。</p>
<a class="card" href="kafka/">
<b>Kafka 互动课程 · 22 课</b>
<span>订单系统场景 · 故障驱动学习 · 从解耦、Partition、Offset 一路讲到事务、Outbox、CDC、Kafka Streams 和安全。单文件、离线可用。</span>
<em>开始学习 →</em>
</a>
<a class="card" href="rabbitmq/">
<b>RabbitMQ 入门互动课 · 8 课</b>
<span>消息分拣中心系列 · 从「为什么需要消息队列」讲到核心概念、工作队列、发布 / 订阅、direct 与 topic 路由、确认与持久化、死信，以及实战排查和选型。每课一个可以亲手操作的等距场景和一组小测验。</span>
<em>开始学习 →</em>
</a>
</main>
</body>
</html>
