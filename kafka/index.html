const LESSONS = [{"n": 1, "title": "为什么需要 Kafka？", "topics": "Producer · Topic · Consumer", "problem": "同步调用使订单链路受下游故障影响", "original": "同步调用：Order Service 依次调用 Inventory → Notification → Analytics，每一步都要等对方返回成功，三步都成功这一单才算完成。点击「让 Notification 宕机」，看看会发生什么。", "solution": "引入 Kafka：Order Service（Producer）把订单消息写入 Topic order-events 的 Partition 后立即返回；Inventory、Notification、Analytics（Consumer）各自从 Kafka 读取，按自己的速度处理。同样让 Notification 宕机，和上一张图对比。", "failure": "Notification 崩溃 10 分钟，下单不受影响；发给它的消息留在 Kafka 里，服务恢复后从上次读到的位置接着处理。", "key": "Kafka 的最重要价值是解耦、异步缓冲和独立扩容。", "question": "Notification 下线 10 分钟、Kafka 正常且保留 7 天，最可能发生什么？", "options": ["所有订单停止接收", "库存与分析继续消费，通知恢复后可补处理", "库存消费会删除 Kafka 消息", "Kafka 自动代替通知服务发送短信"], "answer": 1}, {"n": 2, "title": "Partition：为什么多开实例没效果？", "topics": "Topic · Partition · 多实例并行", "problem": "订单高峰：每秒写入的订单比 Notification 每秒能处理的多，没有任何宕机，待读取却一直上涨。", "original": "订单量上涨后，写入速度超过了 1 个 Notification 实例的处理速度。多开几个实例看起来是个办法，但 Topic 只有 1 个 Partition 时，只有 1 个实例能读，其余实例只能空闲。先点「订单高峰」，再拖动实例数试试。", "solution": "把 Topic 拆成多个 Partition：Producer 把消息轮流写进 4 个 Partition，多个实例各自负责一部分 Partition，就能并行处理。拖动实例数，观察 Partition 是怎样分给实例的。", "failure": "某个实例宕机时，它负责的 Partition 会自动交给其他还在运行的实例，消息仍在 Kafka 里，换个实例接着读，不会丢。这个重新分工的过程叫 Rebalance，第 8 课细讲。", "key": "同一个服务的多个实例之间，一个 Partition 同一时间只交给一个实例读，所以能同时干活的实例数，最多等于 Partition 数。", "question": "order-events 有 2 个 Partition，notification-group 开了 8 个实例。同一时刻最多有几个实例在读？", "options": ["2 个，其余 6 个空闲", "8 个，每个实例分到八分之一的消息", "4 个，每个 Partition 分给两个实例", "1 个，其余实例做热备"], "explain": "同一个组里，一个 Partition 同一时间只交给一个实例。实例数超过 Partition 数时，多出来的实例只能空闲；想提高并行度，要先增加 Partition。", "answer": 0}, {"n": 3, "title": "Consumer Group：组内分工，组间各读一份", "topics": "group.id · 组内分工 · 组间独立", "problem": "新上线的 Inventory 服务直接复制了 Notification 的配置，group.id 也没改。结果一部分订单没扣库存，Notification 也开始漏发通知。", "original": "Kafka 怎么知道哪些实例该分工、哪些该各读一份？它只看 group.id。Inventory 用了和 Notification 一样的 group.id，4 个实例就被当成同一组，一起分 4 个 Partition，两个服务都只收到一部分订单。点击按钮把 group.id 改正，对比两个服务收到的订单比例。", "solution": "给每个服务设置自己的 group.id：同一个 group.id 的实例组成一个 Consumer Group，组内分工读 Partition；不同 Group 之间互不影响，各自读到全部消息。试试让 Notification 的实例宕机，或者接入一个新的 Analytics 服务。", "failure": "notification-group 的某个实例宕机，只有这个组内部重新分工；整个组都宕机，它的读取位置停在原地，inventory-group 照常往前读。每个组各自记住自己读到了哪里，第 4 课把这个位置叫 Offset。", "key": "Kafka 用 group.id 判断：同组分工（每条消息只给组内一个实例），不同组各读一份（每个组都拿到全部消息），每个组各自记录读到哪里。", "question": "新上线的 Analytics 服务不小心用了 group.id = inventory-group。会发生什么？", "options": ["Analytics 也能收到全部订单，和 Inventory 互不影响", "Kafka 拒绝连接，因为这个 group.id 已经有人在用", "Inventory 会把每笔订单处理两次", "两个服务被当成同一个组、一起分 Partition：部分订单没扣库存，Analytics 也只收到一部分"], "explain": "group.id 相同就是同一个组：组内分工读，每条消息只交给其中一个实例。不同的服务要用不同的 group.id，才能各自读到完整的一份。", "answer": 3}, {"n": 4, "title": "Offset 与 Lag：落后多少？从哪里继续？", "topics": "Offset · Committed Offset · LEO · Lag", "problem": "Notification 的实例都显示 Running、没有任何报错，但用户收到通知越来越晚。到底落后了多少？实例重启后又从哪里接着读？", "original": "第 3 课的彩色小旗、前几课说的「待读取」，这一课都有了正式名字：格子下面的数字是 Offset，小旗是 Committed Offset，末端的标杆是 LEO，小旗到标杆之间的距离就是 Lag。点击「短信供应商变慢」，看着 Lag 涨起来，再从下面的命令输出里把它读出来。", "solution": "实例按「拉取 → 处理 → 提交」的顺序工作。提交（Commit）就是告诉 Kafka「下一条该读谁」，Kafka 按 Group + Partition 记住这个位置。崩溃重启后，实例只能从已提交的位置继续：已经处理、但还没提交的消息，会被再处理一遍。切换提交方式，再让实例崩溃试试。", "failure": "提交得越晚，崩溃后重复处理的消息越多；已经处理、还没提交的消息也仍然算在 Lag 里。重复处理会带来什么后果（比如短信发两次），第 5 课细讲。", "key": "Offset 是消息在 Partition 里的编号；Committed Offset 表示「下一条该读谁」；Lag = LEO − Committed Offset，按 Partition 计算、按 Group 分开，还要换算成时间、看趋势。", "question": "notification-group 的 describe 输出：P0 的 CURRENT-OFFSET 1000、LOG-END-OFFSET 1500；P1 是 1100 / 1200；P2 是 1000 / 1000。这个组的总 Lag 是多少？", "options": ["500（只看最大的那个 Partition）", "1,200（P1 的 LOG-END-OFFSET）", "600", "3,700（三个 LOG-END-OFFSET 相加）"], "explain": "Lag = LOG-END-OFFSET − CURRENT-OFFSET，每个 Partition 分别算再相加：500 + 100 + 0 = 600。排查时还要看各个 Partition 的 Lag，判断是不是只卡在某一个上。", "answer": 2}, {"n": 5, "title": "Offset 提交与幂等：重复了怎么办？", "topics": "at-least-once · at-most-once · 幂等 · 去重", "problem": "接着第 4 课：短信已经发出去、Offset 还没提交时实例崩溃，重启后同一条短信又发了一次。那改成先提交再发短信呢？", "original": "沿用第 4 课放大看的 Partition，实例处理一条消息就是给用户发一条短信。分别选「先发短信，再提交」和「先提交，再发短信」，各制造一次崩溃，看看用户手机收到了什么。", "solution": "在 Kafka 里，同一条消息被处理两次是常态：崩溃、Rebalance、Producer 重试都会造成。所以一般选「先处理再提交」（at-least-once），再让处理本身变成幂等：给每条消息一个稳定的 eventId，用去重表记下处理过的 eventId，调用外部服务时把 eventId 当作幂等键。", "failure": "去重表只能挡住「已经记下来」的重复：如果短信发出后、写去重表前崩溃，结果就是未知的，只能靠短信供应商按幂等键去重。另外别忘了：Java Consumer 默认每 5 秒自动提交一次 Offset，把消息交给后台线程异步处理时，可能还没处理完就已经提交了。", "key": "Kafka 默认只能做到「至少一次」：先处理再提交，并让处理逻辑幂等（稳定的 eventId + 去重表 + 外部幂等键），重复消费才不会变成重复业务。", "question": "Notification 的处理是「发短信」。实例在短信已经发出、Offset 还没提交时崩溃了。哪种设计最合理？", "options": ["改成先提交 Offset 再发短信，这样就不会重复", "保持「处理成功后再提交」，并在发送前按 eventId 去重，重复的消息不再发第二次", "每次重启换一个新的 group.id，避开旧的 Offset", "打开 enable.auto.commit，交给 Kafka 自动处理"], "explain": "先提交再处理会漏发（at-most-once）；先处理再提交，崩溃时会重复（at-least-once），配合 eventId 幂等去重，才能做到效果上只发一次。换 group.id 或自动提交都消除不了这个窗口期。", "answer": 1}, {"n": 6, "title": "Broker 与副本：Kafka 自己宕机怎么办？", "topics": "Broker · Replica · RF · Leader / Follower", "problem": "前 5 课一直默认 Kafka 不会坏。可 Kafka 本身也跑在服务器上：如果存放某个 Partition 的那台服务器宕机、甚至磁盘损坏，会发生什么？", "original": "这张图回到 Kafka 集群内部：3 台服务器（Broker）各存放一个 Partition，每个 Partition 只有一份数据（RF=1）。先让 Broker 2 宕机，再试试磁盘损坏，对比「暂时不可用」和「永久丢失」。", "solution": "给每个 Partition 存多份副本（Replica）：RF=3 时，同一个 Partition 在 3 台不同的 Broker 上各有一份。其中一份是 Leader，负责所有读写；其余是 Follower，只从 Leader 复制数据。点任意一台 Broker 让它宕机，观察 Leader 怎样切换。", "failure": "Leader 所在的 Broker 宕机时，Controller 会从和 Leader 保持同步的 Follower 中选出新 Leader（什么叫「保持同步」，第 7 课讲）。切换期间有一小段时间写不进去，Producer 靠重试扛过去。副本也有代价：RF=3 意味着三倍的磁盘和复制流量。", "key": "Broker 是存放 Partition 的服务器；RF 决定每个 Partition 存几份，副本必须分散在不同 Broker 上；Leader 负责读写，宕机时由 Follower 接任。RF 越大越安全，成本也越高，而且不能超过 Broker 数。", "question": "集群有 3 台 Broker，order-events 的 RF = 1，P1 只放在 Broker 2 上。Broker 2 宕机后，P1 会怎样？", "options": ["Kafka 从其他 Broker 上找到 P1 的备份，继续服务", "所有 Partition 都不能读写了", "Consumer 会从头重建 P1 的历史消息", "P1 暂时不可用：它只有这一个副本，要等 Broker 2 恢复（磁盘坏了数据就丢了）"], "explain": "RF = 1 没有别的副本可以接替，只有 P1 受影响，其他 Partition 照常工作。生产环境通常用 RF = 3，Leader 宕机时从 ISR 里选出新 Leader。", "answer": 3}, {"n": 7, "title": "ISR 与 acks：写入怎样才算成功？", "topics": "ISR · acks · min.insync.replicas · HW", "problem": "第 6 课说 RF=3 能扛住 Broker 宕机，可它不保证消息不丢：如果 Leader 刚写进去、Follower 还没复制它就宕机了呢？还有，终端里那一列 Isr 到底是什么意思？", "original": "放大看 Partition 0 的 3 个副本。Producer 用 acks=1：Leader 写进去就回复成功。先让 Follower 复制变慢，再让 Leader 宕机，看看 Producer 以为成功的消息去哪了。", "solution": "ISR 是和 Leader 保持同步的副本集合。Producer 设 acks=all 时，要等 ISR 里的副本都复制完才算成功；再给 Topic 设 min.insync.replicas，ISR 太小时宁可拒绝写入。切换 acks 和 min.insync.replicas，让 Follower 变慢、让 Broker 宕机，看看写入什么时候成功、什么时候被拒绝。", "failure": "ISR 会随副本状态变化：Follower 落后超过 replica.lag.time.max.ms（默认 30 秒）就被踢出，追上后再加回来。ISR 少于 min.insync.replicas 时，acks=all 的写入会收到 NotEnoughReplicasException，而不是自动降低标准；ISR 全部宕机时，默认也不会让落后的副本当 Leader。", "key": "acks=all 等的是 ISR 里的副本，不是所有副本；min.insync.replicas 给 ISR 设下限。推荐 RF=3 + min.insync.replicas=2 + acks=all：能扛住 1 台 Broker 宕机，既不丢已确认的数据，也不停写。", "question": "RF = 3，min.insync.replicas = 2，Producer 用 acks=all。现在两个 Follower 都掉出了 ISR，只剩 Leader。写入会怎样？", "options": ["被拒绝：ISR 小于 min.insync.replicas，Producer 收到 NotEnoughReplicas 错误", "成功，因为 RF = 3", "成功，acks=all 只要 ISR 里的副本（现在只有 Leader）确认就够了", "Kafka 自动把 min.insync.replicas 降到 1，继续写入"], "explain": "acks=all 等的是 ISR 里的副本，min.insync.replicas 给 ISR 设了下限。ISR 只剩 1 个时宁可拒绝写入，也不让只有一份的数据被确认。第三个选项正是 min.insync.replicas 要防止的情况。", "answer": 0}, {"n": 8, "title": "Consumer Rebalance：实例来来去去时，Partition 怎么重新分？", "topics": "Rebalance · Coordinator · 心跳 · Eager / Cooperative", "problem": "订单量涨了，给 notification-group 新增一个实例，消费反而整体停了一下，Lag 迅速上涨；另一个实例处理慢一点，组里竟然反复「重新分配」。这是怎么回事？", "original": "前两课讲的是 Kafka 自己的服务器出问题时，Partition 的 Leader 怎么换；这一课回到读消息的一方：Consumer 实例加入、退出或宕机时，组里的 Partition 怎么重新分？先点「新增实例 4」，再让实例 2 处理变慢。", "solution": "这个重新分配叫 Rebalance，由 Group Coordinator（某一台 Broker）发起。默认的 Eager 方式会让全组先交出全部 Partition、一起停读；Cooperative（增量）方式只移动必须移动的 Partition。再配合静态成员（group.instance.id）和合理的超时参数，可以少触发、少停读。切换方式，试试几种离组的情况。", "failure": "实例崩溃时没法通知 Coordinator，要等 session.timeout.ms（默认 45 秒）收不到心跳才会触发 Rebalance，这段时间它的 Partition 没人读；处理太慢、超过 max.poll.interval.ms（默认 5 分钟）会被踢出组，反复踢出又加入就成了 Rebalance 风暴。Partition 换实例后从已提交的位置开始读，还会带来重复处理。", "key": "Rebalance 会停读：暂停多久 × 写入速度 = 新增的 Lag，之后处理速度必须大于写入速度才能追回来。用 Cooperative、静态成员和合理的 poll 参数，减少 Rebalance 的次数和范围。", "question": "notification-group 有 3 个实例。发布新版本时逐个重启，每次重启都触发 Rebalance、全组停读好几秒。哪种做法最直接地减少这种停顿？", "options": ["把 session.timeout.ms 调到 1 秒，让 Kafka 更快发现实例离开", "每次重启前给 Topic 加一个 Partition", "给每个实例配置固定的 group.instance.id（静态成员），并使用 cooperative-sticky 分配", "重启前先删除 notification-group 的 Offset"], "explain": "静态成员在 session.timeout.ms 之内重启回来，不会触发 Rebalance；cooperative-sticky 只移动必须移动的 Partition，其他实例照常读。超时调得太小反而更容易误判，触发更多 Rebalance。", "answer": 2}, {"n": 9, "title": "Retention 与 Replay：消息会保留多久？怎么重新读？", "topics": "Retention · Segment · log start offset · Replay", "problem": "第 1 课说，下游宕机时消息会留在 Kafka 里等它恢复；第 8 课的 Rebalance 只停了几秒。可如果 Notification 不是停几秒，而是停了好几天呢？Kafka 不会永远保存消息。", "original": "这张图里一格代表一天的消息（一个 Segment），Topic 保留 7 天。先观察旧 Segment 怎样被清理，再让 Notification 停机，等超过 7 天再恢复，看看它停机期间的订单还在不在。", "solution": "Kafka 按 retention.ms（时间）或 retention.bytes（容量）整段删除旧 Segment，和消息有没有被读过无关。只要消息还在保留期内，就可以重放：新开一个 group.id、用 kafka-consumer-groups.sh --reset-offsets 回退，或在代码里 seek()。切换保留天数，试试让新服务读历史、把某个组回退重放。", "failure": "Consumer 提交的位置一旦早于 log start offset，重启时会遇到 OffsetOutOfRange，Kafka 按 auto.offset.reset 跳到最早或最新的位置（第 16 课），中间被清理的消息静默丢失、不报错。组停用太久时，连它提交的 Offset 本身也会过期（offsets.retention.minutes，默认 7 天）。", "key": "Retention 只看时间和容量，不管消息有没有被读过；保留期要比「最长可能停机的时间 + 追回 Lag 的时间」更长，重放时处理逻辑必须幂等。", "question": "order-events 的 retention.ms 是 7 天。notification-group 停了 10 天才恢复，它停机最早那几天的订单为什么读不到了？", "options": ["其他组读完以后，消息就被删除了", "超过 7 天的 Segment 已按保留规则整段删除，和有没有被读过无关", "其实还能读到：Kafka 发现有组没读，会自动延长保留期", "Consumer 停机时，Kafka 会把它的 Offset 清零"], "explain": "Retention 只看时间和容量，不管消息有没有被读过。停机超过保留期，组提交的位置早于 log start offset，重启时会按 auto.offset.reset 跳走（第 16 课），中间的消息静默丢失。", "answer": 1}, {"n": 10, "title": "Message Key 与顺序：同一笔订单的事件怎样不乱？", "topics": "Key · 分区规则 · 顺序范围", "problem": "同一笔订单会依次产生「创建、付款、发货」三条事件。没指定 Key 时，它们被分散到不同的 Partition，结果付款比创建先被处理，订单服务报错「订单不存在」。", "original": "第 2 课说 Producer 把消息轮流写进各个 Partition，第 6 课说订单按订单号固定分到某个 Partition，这一课把两者讲清楚。先看不指定 Key 时，同一笔订单的三条事件会去哪里、按什么顺序被处理。", "solution": "给消息指定 Key：Kafka 用 hash(Key) % Partition 数决定写进哪个 Partition：只要 Partition 数量和分区规则不变，同一个 Key 就总落在同一个 Partition，而 Kafka 保证同一个 Partition 内部有序。切换三种写法，再试试把 Partition 从 3 个扩到 4 个。", "failure": "Key 选对了，顺序仍可能在三个地方被破坏：扩 Partition 让 Key 的映射变了；没开幂等时 Producer 重试可能打乱批次顺序（第 11 课）；Consumer 把同一个 Partition 的消息交给线程池并发处理。", "key": "Kafka 只保证同一个 Partition 内部有序；按「哪些消息之间必须有序」来选 Key，订单级顺序就用 orderId，并且提前预留好 Partition 数。", "question": "同一笔订单会依次产生 CREATED、PAID、SHIPPED 三条事件，Inventory 必须按这个顺序处理。Key 应该用什么？", "options": ["事件类型（eventType），同类事件放在一起", "每条消息随机生成一个 UUID，分布最均匀", "不指定 Key，交给 sticky partitioner", "订单号（orderId）"], "explain": "Kafka 只保证同一个 Partition 内有序。用订单号做 Key，Partition 数不变时同一笔订单的事件进同一个 Partition，顺序就保住了。事件类型做 Key 会形成热点（第 13 课），随机 Key 或不指定 Key 都会打乱同一订单的顺序。", "answer": 3}, {"n": 11, "title": "Producer 重试与幂等：确认丢了会怎样？", "topics": "retries · delivery.timeout.ms · 幂等 Producer · max.in.flight", "problem": "Kafka 其实已经把订单写进去了，可回给 Producer 的确认（ACK）在网络上丢了。Producer 以为没写成功，自动重试，日志里出现了两条一模一样的订单；有时连顺序也乱了。", "original": "acks 决定等谁确认，第 7 课讲过；这一课讲「等不到确认」之后发生的事。打开「网络抖动」，让一部分请求和确认在路上丢失，看看 Partition 的日志里会出现什么。再把 max.in.flight 改成 1 对比。", "solution": "打开 enable.idempotence（Kafka 3.0 起默认开启）：Producer 带上 PID 和递增的序号，Broker 记住每个 PID 最后写入的序号，重复的直接忽略、跳号的拒绝重发，于是重试既不会写出重复，也不会打乱顺序。最后试试「应用代码又 send 了一次」，看看它挡不住什么。", "failure": "幂等 Producer 只认「同一次发送的重试」：应用代码再调用一次 send()、用户重复点击、Producer 重启后重发，都是带新序号的新消息，照样写进去。业务上的重复要靠 eventId 在 Consumer 端去重（第 5 课）；重试超过 delivery.timeout.ms 仍失败时，send() 的回调会收到异常，应用必须自己处理。", "key": "Producer 协议层的幂等不等于业务幂等：开启幂等能消除重试带来的重复和乱序，但应用层的重复发送仍要靠 eventId 在 Consumer 端去重。", "question": "下面哪种重复，幂等 Producer（enable.idempotence=true）挡不住？", "options": ["应用代码在异常处理里又调用了一次 send()，同一笔订单发了两遍", "确认（ACK）在网络上丢了，Producer 自动重试同一个批次", "请求超时后 Producer 自动重试，其实第一次已经写成功", "同时有 5 个请求在路上（max.in.flight=5），其中一个失败重试"], "explain": "幂等 Producer 靠 PID + 序号识别「同一次发送的重试」。应用自己再调一次 send()，对 Kafka 来说是一条新消息、带新序号；这种业务层的重复，要靠 eventId 在 Consumer 端去重（第 5 课）。", "answer": 0}, {"n": 12, "title": "Lag 故障定位：Lag 涨了，先查哪里？", "topics": "症状 → 原因 · 监控指标 · 排查顺序", "problem": "notification-group 的 Lag 涨到上百万，实例都在运行。第一反应是「加实例」，结果 Lag 涨得更快了：Consumer CPU 只有 15%，MySQL CPU 却到了 95%，连接池也用满了。", "original": "Lag 只是症状：它说明消费速度跟不上写入速度，但没说为什么。先在这张图里点「加实例到 8 个」，再对照下面的监控面板，看看问题到底在哪。", "solution": "按顺序看指标：写入和消费速率 → 各 Partition 的 Lag 是一起涨还是只有个别在涨 → Consumer 的 CPU、错误和重试 → 下游数据库的耗时和连接池 → Rebalance 次数。切换四种故障原因，先读面板判断，再试试「加实例」和「修复根因」哪个有效。", "failure": "不同原因要用不同的办法：处理能力不够才需要加实例；下游变慢要优化或扩容下游、必要时限流（第 15 课）；Rebalance 风暴要调 poll 参数（第 8 课）；单个 Partition 卡住要处理坏消息（第 14 课）或热点 Key（第 13 课）。盲目加实例，可能让下游更挤。", "key": "Lag 是症状，不是原因：先用监控指标定位瓶颈，再对症处理；只有在 Consumer 处理能力不够时，加实例才有效。", "question": "notification-group 的 Lag 一直在涨。Consumer 实例 CPU 只有 15%，它写入的 MySQL CPU 95%、每次写入要 500 毫秒。最先该做什么？", "options": ["把 Consumer 实例扩到 20 个", "把 Partition 扩到 20 个", "先查 MySQL：慢 SQL、锁等待、连接池", "把 Offset 重置到最新，先把 Lag 清掉"], "explain": "Lag 只是症状。Consumer 很闲、下游很忙，瓶颈在下游；这时加实例或加 Partition 只会给 MySQL 更大的压力。重置 Offset 等于直接丢掉积压的消息。", "answer": 2}, {"n": 13, "title": "热点 Partition：一个 Partition 忙死，其他闲着", "topics": "热点 Key · 负载不均 · 加盐", "problem": "订单按商户号做 Key。双十一当天，大商户 M1 一家就占了 70% 的订单，全部落进同一个 Partition：它的 Lag 一路上涨、处理它的实例满负荷，其他实例却很闲。加实例、加 Partition 都不管用。", "original": "第 10 课说过 Key 太粗会造成热点；这次的 Key 本身没选错，是某一个 Key 太大。先看监控面板上各 Partition 的写入速率，再试试「加实例」和「加 Partition」。", "solution": "热点要靠换 Key 来拆：只需要订单级顺序时，Key 用订单号；必须按商户分组时，只给热点商户「加盐」，Key = 商户号 + 分片号，把它拆到几个 Partition。切换三种 Key，对比负载分布和各自保住的顺序范围。", "failure": "同一个 Key 总是落到同一个 Partition，一个 Partition 同一时间只交给组里一个实例（第 2 课），所以加实例、加 Partition 都拆不开单个热点 Key；加 Partition 还会打乱已有 Key 的映射（第 10 课）。换 Key 同样会改变映射，切换时要停写、等进行中的订单处理完，或者写新 Topic 后逐步切换。", "key": "先看各 Partition 的写入速率和 Key 的分布，找到热点；再在「负载均匀」和「需要的顺序范围」之间选 Key，必要时只给热点 Key 加盐。", "question": "order-events 用事件类型做 Key，80% 的消息 Key 都是 ORDER_CREATED：P2 一直满负荷，其他 Partition 很闲。业务只需要同一笔订单的事件有序。长期该怎么改？", "options": ["把 Consumer 实例扩到 20 个", "改用订单号做 Key，并规划好切换期间的顺序（比如先把旧 Key 的积压消费完再切）", "只把 Partition 从 6 个扩到 12 个", "关闭 Offset 提交，让 P2 读得快一点"], "explain": "同一个 Key 总落在同一个 Partition，单个热点 Key 靠加实例、加 Partition 都拆不开。业务只要订单级顺序，就用订单号做 Key；切换 Key 会让同一订单的新旧事件落到不同 Partition，要规划好迁移。", "answer": 1}, {"n": 14, "title": "Poison Pill、重试与死信 Topic：一条坏消息怎么处理？", "topics": "毒丸 · 退避重试 · DLT · 顺序", "problem": "一条格式错误的 JSON 混进了 order-events。Consumer 每次解析都失败，一直重试，这个 Partition 后面几万条消息全被堵住（第 12 课的「单个 Partition 卡住」）。改成出错就跳过呢？又悄悄丢了消息。", "original": "每笔订单有「创建、付款」两条事件，#6 是一条坏 JSON。先看「失败就一直重试」会怎样，再切到「catch 住直接跳过」，对比两种写法各自的问题。", "solution": "先给错误分类：暂时错误（数据库超时、网络抖动）有限次重试、间隔逐渐拉长；永久错误（格式错、校验不通过）把原消息连同错误信息写进死信 Topic（DLT），确认写成功后再提交 Offset，继续往后读。试试注入两种错误，打开「按订单暂停」，最后从 DLT 重放。", "failure": "DLT 只是把故障隔离开：跳过一条事件后，同一订单后面的事件照常处理，可能破坏业务顺序，需要按 Key 暂停；下游长时间不可用时，不该每条都重试到进 DLT，而是暂停消费、保护下游（第 15 课）。", "key": "重试只对暂时错误有意义；永久错误进 DLT，确认写成功后再提交 Offset。DLT 是隔离故障的手段，不自动保证顺序或恰好一次。", "question": "Notification 读到一条格式错误的 JSON，每次解析都失败。各条通知之间互不依赖。正确的处理是？", "options": ["一直重试，直到成功为止", "catch 住异常直接跳过，不用保存", "暂停整个 Partition，等人工修复", "有限重试后写进死信 Topic（DLT），确认写入成功后再提交 Offset"], "explain": "格式错误是永久错误，重试多少次都一样，无限重试会卡住整个 Partition；直接跳过会悄悄丢消息。写进 DLT 并确认成功后再推进 Offset，既不堵也不丢。通知彼此独立，也不需要按 Key 暂停。", "answer": 3}, {"n": 15, "title": "Backpressure：下游扛不住时怎么办", "topics": "限流 · 批量写入 · pause / resume · 熔断", "problem": "大促时订单写入涨到每秒 12,000 条，而通知服务要写的 MySQL 每秒只能稳定写约 5,000 条。Consumer 有多少写多少，MySQL 超时、连接池耗尽，失败重试又加重负担，实际写成功的反而更少。", "original": "在第一张图里点「大促开始」：MySQL 负载冲破 100%，耗时飙升，超时失败越来越多，写成功的条数反而跌到 5,000 以下。", "solution": "Backpressure（背压）：下游扛不住时，让上游慢下来。Consumer 端按 MySQL 的能力限流（全组合计），多出来的消息先留在 Kafka 里排队；同时用批量写入提升处理能力；下游故障时用 pause() 暂停读取，但继续 poll() 维持心跳，恢复后 resume()。", "failure": "限流保护了 MySQL，但 Lag 会以每秒约 7,000 条的速度上涨。要算清楚：积压换算成时间离保留期还有多远、高峰后多久能追平；如果写入长期高于处理能力，限流只是在拖延，必须提升处理能力。", "key": "Backpressure 保护下游，但不解决长期容量缺口。", "question": "大促期间订单写入每秒 12,000 条，而 Notification 要写的 MySQL 每秒只能稳定写 5,000 条。合理的做法是？", "options": ["按 MySQL 的能力限流，多出来的消息在 Kafka 里排队；同时盯住 Lag 换算成的时间、保留期和追平时间", "把 Consumer 扩到 30 个实例，加快写 MySQL", "先提交 Offset、跳过写库，保证不积压", "直接删除积压的消息，等高峰过去"], "explain": "下游扛不住时，加实例只会更快地压垮 MySQL。限流让消息在 Kafka 里排队（Backpressure），代价是 Lag 上涨，所以要算清楚积压换算成的时间离保留期还有多远、高峰后多久追平。", "answer": 0}, {"n": 16, "title": "group.id 与 auto.offset.reset：Consumer 从哪里开始读", "topics": "group.id · __consumer_offsets · earliest / latest / none", "problem": "大促过后 notification-group 还有积压，新版本上线时顺手把 group.id 改成了 notification-v2。新组没有 Committed Offset，按默认的 latest 从末尾开始读，积压的几十万条通知全部被跳过，没有任何报错。", "original": "在第一张图里点「部署新版本」：新组的小旗直接出现在 LEO，中间的格子变红。新组的 Lag 接近 0，看起来一切正常；老组没有成员，Lag 却一直涨。", "solution": "Consumer 启动时，先查 __consumer_offsets 里这个 group.id 的 Committed Offset：有记录、而且还在 [log start, LEO] 范围内，就从那里接着读；找不到有效位置时，才按 auto.offset.reset 决定：earliest 从 log start 开始，latest 从 LEO 开始，none 直接报错。非改 group.id 不可时，先用 --reset-offsets 给新组设好位置。", "failure": "earliest 会把保留期内的历史全部再处理一遍，处理逻辑必须幂等；latest 会静默跳过历史；none 会让 Consumer 启动失败，需要有人介入。已有有效 Offset 的组，改 auto.offset.reset 不会改变起点，要调整位置得用 --reset-offsets 或 seek()。", "key": "改 auto.offset.reset 不会覆盖已有的有效 Group Offset；换 group.id 等于从零开始。", "question": "老组 notification-group 的 Committed Offset 是 600，LEO 是 1000。新部署的 notification-v2 用了新的 group.id，配置 auto.offset.reset=latest。它第一次启动从哪里读？", "options": ["从 600 开始，自动继承老组的位置", "从最早还在的消息开始，读全部历史", "从 1000 开始，600–999 这 400 条被跳过", "启动失败，因为找不到 Offset"], "explain": "Offset 按 group.id 保存，新组没有记录，只能按 auto.offset.reset 决定：latest 从 LEO 开始。从最早开始是 earliest，启动失败是 none。要继承老组的位置，得先用 --reset-offsets 给新组设好。", "answer": 2}, {"n": 17, "title": "Schema Evolution：消息格式怎么安全地改", "topics": "Schema Registry · Backward / Forward / Full · 发布顺序", "problem": "Producer 把 quantity 从整数改成字符串就上线了。inventory 和 notification 两个组读到新格式的消息就反序列化失败，消息变成毒丸卡住 Partition，Lag 一路上涨；回滚 Producer 也没用，已经写进去的消息改不掉。", "original": "在第一张图里点「Producer 发布新版本」：两个组都卡在第一条 v2 消息上。再点「回滚 Producer」：新消息恢复了，Consumer 还是卡着。", "solution": "把消息格式当成契约（Schema）管起来：Producer 发送前把 Schema 注册到 Schema Registry，消息里只带 schema id；注册新版本时按兼容模式检查。Backward（新代码能读旧数据）先升级 Consumer，Forward（旧代码能读新数据）先升级 Producer，Full 顺序随意。", "failure": "兼容检查只看 Schema 的结构，不看业务含义：字段名不变、意思变了（比如金额从「元」改成「分」），Registry 拦不住。真正不兼容的改动不要原地改，新加字段，或者换一个新 Topic。", "key": "Schema 变更先过兼容检查，再按兼容方向决定发布顺序；不兼容的改动用新字段或新 Topic。", "question": "要给订单消息新增一个可选字段 currency（默认值 \"CNY\"）：旧 Consumer 会忽略不认识的字段，新 Consumer 读旧消息时用默认值。Schema Registry 是 BACKWARD 模式，怎样发布？", "options": ["直接改 Producer 上线，不用检查", "先让 Registry 检查兼容性并注册；这个改动新旧双向兼容，先升级哪一边都行，习惯上先升级 Consumer", "顺便把 quantity 改成字符串，一次发完", "先清空 Topic 里的旧消息，再发新版本"], "explain": "带默认值的可选字段新读旧、旧读新都没问题（FULL 兼容），发布顺序随意；但仍要先过 Registry 的兼容检查。改字段类型两个方向都不兼容；Topic 里的旧消息不能也不需要清空。", "answer": 1}, {"n": 18, "title": "Kafka 事务与 Exactly-once：边界在哪里", "topics": "transactional.id · sendOffsetsToTransaction · read_committed", "problem": "Inventory 服务读订单、写一条「库存已预留」事件、再提交 Offset。它在写完输出、还没提交 Offset 时崩溃，重启后重读同一个订单又写了一遍，Shipping 重复发货。加上 Kafka 事务以后，又有人发现：事务中止了，MySQL 里的库存却已经扣掉了。", "original": "在第一张图里点「写完输出后、提交 Offset 前崩溃」：inventory-events 里出现两条同一订单（红色），Shipping 发了两次货。", "solution": "用 Kafka 事务把「写输出」和「提交输入 Offset」绑在一起：Producer 配置 transactional.id，beginTransaction → send → sendOffsetsToTransaction → commitTransaction。崩溃后用同一个 transactional.id 重启，没完成的旧事务被中止；下游用 isolation.level=read_committed，跳过被中止的消息。", "failure": "Kafka 的 exactly-once 只覆盖「读 Kafka → 处理 → 写 Kafka」。MySQL、发短信、调用支付接口这些外部副作用不在事务里，Kafka 事务中止不会回滚它们，要靠幂等（eventId 去重表）或 Outbox 来保证。下游如果用 read_uncommitted，也照样会读到被中止的消息。", "key": "Kafka 事务让输出消息和输入 Offset 一起提交；它的边界是 Kafka 本身，外部系统要靠幂等或 Outbox。", "question": "Inventory 的处理是：扣 MySQL 库存（MySQL 自己提交）→ 在 Kafka 事务里写 inventory-events 并提交 Offset。MySQL 已经扣掉了，Kafka 事务却中止了。Shipping 用 read_committed。哪项正确？", "options": ["MySQL 的扣减也会跟着回滚", "Shipping 一定会收到这条事件", "这笔订单之后再也不会被处理", "Shipping 看不到被中止的事件，输入 Offset 也没提交、订单会被重新处理；但 MySQL 已经扣过一次，重处理要靠幂等，否则会多扣"], "explain": "Kafka 事务只覆盖 Kafka 里的读写：被中止的输出对 read_committed 不可见，Offset 没提交，所以会重新处理。MySQL 不在事务里，不会回滚，必须靠 eventId 幂等或 Outbox 来保证只扣一次。", "answer": 3}, {"n": 19, "title": "Transactional Outbox：写库和发消息怎么不丢", "topics": "双写问题 · outbox 表 · Publisher · 稳定的 eventId", "problem": "下单时 Order Service 先把订单写进 MySQL，再发 OrderCreated 到 Kafka。两步之间服务崩溃：订单在、事件丢了，库存没预留、通知也没发。反过来先发消息再写库，又会出现「幽灵订单」。", "original": "在第一张图里选一种顺序，点「两步之间崩溃」：右边的对照表会标出「丢事件」或「幽灵订单」。", "solution": "把「业务数据」和「待发布事件」放进同一个 MySQL 事务：INSERT orders + INSERT outbox_events（PENDING）。另一个 Publisher 扫描 PENDING 的行，发到 Kafka，收到确认后标记 SENT。数据库提交了，事件就一定会被发出。", "failure": "Publisher 发完、标记 SENT 之前崩溃，重启后会再发一次：Outbox 保证「至少发一次」，不是「只发一次」。eventId 必须在写 outbox 时生成并保持不变，Consumer 按 eventId 去重。", "key": "Outbox 用一个数据库事务原子地保存「业务变化 + 待发布事件」；它不是 Kafka 事务，重复要靠稳定的 eventId 去重。", "question": "Outbox 的 Publisher 发完 EVT-1001、还没标记 SENT 就崩溃了，重启后要重发这一行。eventId 应该怎么处理？", "options": ["始终用 EVT-1001；想区分每次尝试，另加一个 attemptId", "每次重发生成新的 eventId，方便追踪", "删掉 eventId，改用 Kafka 的 Offset 去重", "先把这一行标记成 SENT，避免重复发送"], "explain": "Outbox 保证的是至少发一次。eventId 在写 outbox 时生成、之后不变，Consumer 才能认出重复；换新 eventId 会让去重失效。Offset 每次写入都不同，不能用来去重；没确认就标 SENT 可能丢事件。", "answer": 0}, {"n": 20, "title": "Kafka Connect、CDC 与 Debezium：不再轮询 outbox 表", "topics": "binlog · Source Connector · Outbox Event Router · 源位置", "problem": "第 19 课的 Publisher 要定时扫 outbox 表。每秒 2,000 个订单时：间隔短，MySQL 被不停地查；间隔长，事件要等好几秒才发出。而且这套 Publisher 要自己写、自己维护。", "original": "在第一张图里切换轮询间隔：100 毫秒时 MySQL 负载升到 85%，5 秒时事件平均晚 2.5 秒。", "solution": "用 CDC（Change Data Capture）代替轮询：MySQL 本来就把每次提交的变更按顺序写进 binlog。Kafka Connect 运行 Debezium 的 MySQL Source Connector，像从库一样读 binlog，只挑 outbox_events 的 INSERT，经过 Outbox Event Router 变成业务事件写进 Kafka；读到的 binlog 位置定期保存到 Kafka。", "failure": "Connector 发完事件、还没保存 binlog 位置就崩溃，重启后会重发：CDC 也是至少一次，Consumer 仍要按 eventId 去重。Connector 停机超过 binlog 保留期，保存的位置就没了，只能重新快照，中间的事件可能补不回来。", "key": "CDC 代替自己写的轮询 Publisher，但不代替监控运维和 eventId 幂等。", "question": "Debezium Connector 已经把 EVT-1001 发到 Kafka，还没保存 binlog 位置就崩溃了。恢复以后会怎样？", "options": ["MySQL 回滚这次 outbox INSERT", "不会重复，Kafka Connect 保证恰好一次", "从上次保存的位置重读，可能再发一次 EVT-1001，Consumer 要按 eventId 去重", "要删除 Topic 重新同步"], "explain": "Connector 从上次保存的 binlog 位置恢复，中间已经发过的事件会再发一次：CDC 和轮询 Publisher 一样是至少一次。MySQL 里的数据不受影响，下游按 eventId 去重即可。", "answer": 2}, {"n": 21, "title": "Kafka Streams：窗口、迟到数据与状态", "topics": "KStre const own=ownership(s);SL.forEach((g,k)=>{if((s.t+k)%2)return;const G=gid(s,k);let best=-1,bp=0;mine(s,own,k).forEach(p=>{const d=s.pp[p]-s.rd[G][p];if(d>bp){bp=d;best=p}});if(best>=0){s.rd[G][best]++;s.recv[SVC[k]]++;s.done[k]++;api.emit(B.readR(best,SL[k]),SVC[k]==='inv'?'inv':'noti')}})},
view(s,api){const own=ownership(s),gs=Object.keys(groups(s));api.layer('ok',s.bad?'off':'on');api.layer('bad',s.bad?'on':'off');
L3.PG.forEach((g,p)=>{api.log('p'+p,l3Kinds(s,p,gs));SL.forEach((h,k)=>api.layer(`r${p}_${k}`,own[gid(s,k)][p]===k?'on':'off'))});
api.badge('prod',`已写入 ${s.total}`,'neutral');
SL.forEach((g,k)=>{const m=mine(s,own,k);api.badge('i'+k,`${SHORT[SVC[k]]} · ${m.length?l3Pl(m):'空闲'}`,SVC[k]==='inv'&&s.bad?'red':'green')});
const pct=v=>s.total?Math.min(100,Math.round(v/s.total*100)):100,pi=pct(s.recv.inv),pn=pct(s.recv.noti);
const N=s.bad?['① group.id 配错了','red',`新上线的 Inventory 复制了 Notification 的配置，group.id 也是 notification-group。Kafka 只看 group.id，于是把 4 个实例当成同一组，4 个 Partition 在它们之间分工：Inventory 只读到 P2、P3，只处理了约 ${pi}% 的订单；Notification 也只读到 P0、P1，漏发了约 ${100-pn}% 的通知。点击按钮把 Inventory 的 group.id 改正。`]
:['② 各用自己的 group.id','green',`Inventory 改用自己的 group.id（inventory-group）。现在是两个组：每个组在组内分工读完 4 个 Partition，两个服务都能收到全部订单（Inventory 约 ${pi}%，Notification 约 ${pn}%，差的一点是还在路上的消息）。`];
api.narrate(N[0],N[2],N[1]);
api.metrics(`<div class="iso-mhead">已写入 <b>${s.total}</b> 条订单 · 每个服务都应该收到全部订单</div><div class="iso-mgrid">${['inv','noti'].map(v=>{const P=pct(s.recv[v]),tone=P<90?'red':'green';return `<div class="iso-m"><div class="iso-m-h"><b>${NAME[v]}</b><span class="iso-pill tone-${tone}">${P}%</span></div><div class="iso-m-g">group.id = ${s.bad||v==='noti'?'notification-group':'inventory-group'}</div><div class="iso-m-r"><span>收到 <b>${s.recv[v]}</b> / ${s.total} 条</span></div><div class="iso-mbar ${tone}"><i style="width:${P}%"></i></div></div>`}).join('')}</div>`)},
toolbar:s=>`<button type="button" class="iso-btn ${s.bad?'ok':'danger'}" data-act="fix">${s.bad?'✓ 把 Inventory 的 group.id 改成 inventory-group':'↺ 还原错误配置'}</button>`,
actions:{fix:s=>fresh(!s.bad)},
card(id,s){const own=ownership(s);if(id==='prod')return{title:'Order Service',ok:true,rows:[['角色','Producer'],['写入方式','轮流写入 P0→P3'],['已写入',s.total]]};
if(id[0]==='p'&&id!=='prod'){const p=+id.slice(1),G=groups(s);return{title:`Partition ${p}`,ok:true,rows:[['已保存',s.pp[p]],...Object.keys(G).map(g=>[`${g==='noti'?'notification':'inventory'}-group 由谁读`,own[g][p]<0?'无':`${SHORT[SVC[own[g][p]]]} 实例 ${own[g][p]%2+1}`])]}}
const k=+id.slice(1),m=mine(s,own,k);return{title:`${NAME[SVC[k]]} 实例 ${k%2+1}`,ok:true,rows:[['group.id',SVC[k]==='inv'&&s.bad?'notification-group（配错）':gid(s,k)==='inv'?'inventory-group':'notification-group'],['负责的 Partition',m.length?l3Pl(m):'无'],['已处理',s.done[k]]]}}
}}
function lesson3GroupsScene(){
const B=l3Base(),SL=[.2,1.6,3,4.4,5.9],GR=['inv','inv','noti','noti','ana'],GN={inv:'inventory-group',noti:'notification-group',ana:'analytics-group'},SV={inv:'Inventory',noti:'Notification',ana:'Analytics'},SH={inv:'库存',noti:'通知',ana:'分析'};
const fresh=()=>({t:0,total:0,ana:false,anaAt:-999,pp:[0,0,0,0],rd:{inv:[0,0,0,0],noti:[0,0,0,0],ana:[0,0,0,0]},down:[0,0,0,0,0].map(()=>false),done:[0,0,0,0,0]});
const active=s=>['inv','noti',...(s.ana?['ana']:[])],alive=(s,g)=>GR.map((x,k)=>k).filter(k=>GR[k]===g&&!s.down[k]);
const ownership=s=>{const o={};active(s).forEach(g=>o[g]=l3Own(alive(s,g)));return o},mine=(own,k)=>own[GR[k]]?L3.PG.map((g,p)=>p).filter(p=>own[GR[k]][p]===k):[];
const pendOf=(s,g)=>s.pp.reduce((a,v,p)=>a+v-s.rd[g][p],0),readOf=(s,g)=>s.rd[g].reduce((a,v)=>a+v,0);
return{title:'两个 Consumer Group：组内分工，组间各读一份',width:870,height:475,origin:[335,60],pathZ:4,ground:{gx:[-.3,11.6],gy:[-.6,7.4]},
frames:[...B.frames,{x:[9.8,11],y:[-.4,2.2]},{x:[9.8,11],y:[2.4,5]},{x:[9.8,11],y:[5.25,6.55],layer:'ana'}],
platforms:[...B.platforms,{x:[10,10.8],y:[-.2,2]},{x:[10,10.8],y:[2.6,4.8]},{x:[10,10.8],y:[5.45,6.35],layer:'ana'}],
texts:[...B.texts,{at:[11.35,2.15],text:GN.inv,dir:'gy'},{at:[11.35,4.95],text:GN.noti,dir:'gy'},{at:[11.35,7.2],text:GN.ana,dir:'gy',layer:'ana'}],
logs:B.logs,paths:[...B.paths,...B.readPaths(SL)],
nodes:[B.prodNode,...SL.map((g,k)=>({id:'i'+k,at:[L3.CX,g],size:.65,h:30,label:`${SV[GR[k]]} 实例 ${GR[k]==='ana'?1:k%2+1}`,hideLabel:true,badge:true,state:GR[k]==='noti'?'normal':GR[k],layer:GR[k]==='ana'?'ana':undefined}))],
note:'格子带前面的彩色小旗，表示每个组在这个 Partition 里「读到这里」：<span style="color:#24968a;font-weight:700">蓝绿</span>是 inventory-group，<span style="color:#6f69de;font-weight:700">紫色</span>是 notification-group，<span style="color:#c95a8c;font-weight:700">粉色</span>是 analytics-group。每个组各记各的，第 4 课会给这个位置一个名字：<b>Offset</b>。',
init:()=>fresh(),
tick(s,api){s.t++;if(s.t%3===0){const p=s.total%4;s.total++;s.pp[p]++;api.emit(B.prodR(p,Math.min(s.pp[p],L3.NC)-1),'prod')}
const own=ownership(s);SL.forEach((g,k)=>{const G=GR[k];if(s.down[k]||!own[G]||(s.t+k)%2)return;let best=-1,bp=0;mine(own,k).forEach(p=>{const d=s.pp[p]-s.rd[G][p];if(d>bp){bp=d;best=p}});if(best>=0){s.rd[G][best]++;s.done[k]++;api.emit(B.readR(best,SL[k]),G)}})},
view(s,api){const own=ownership(s),gs=active(s);api.layer('ana',s.ana?'on':'off');
L3.PG.forEach((g,p)=>{api.log('p'+p,l3Kinds(s,p,gs));const n=Math.min(s.pp[p],L3.NC),base=s.pp[p]-n;api.logMarks('p'+p,gs.map(G=>({pos:Math.max(0,Math.min(n,s.rd[G][p]-base)),cls:'mk-'+G})));SL.forEach((h,k)=>api.layer(`r${p}_${k}`,own[GR[k]]&&own[GR[k]][p]===k?'on':'off'))});
api.badge('prod',`已写入 ${s.total}`,'neutral');
SL.forEach((g,k)=>{const m=mine(own,k),G=GR[k];api.node('i'+k,s.down[k]?'down':m.length?(G==='noti'?'normal':G):'idle');api.badge('i'+k,s.down[k]?'DOWN':m.length?l3Pl(m):'空闲',s.down[k]?'red':m.length?'green':'neutral')});
const dk=SL.findIndex((g,k)=>s.down[k]),grpDown=active(s).find(G=>!alive(s,G).length);let N;
if(grpDown)N=['③ 整个组停下','red',`${GN[grpDown]} 的实例全部宕机，这个组停在原地（看它的小旗不动了），发给它的消息留在 Kafka 里，待读取 ${pendOf(s,grpDown)} 条。其他组照常读，小旗继续往前走：每个组各自记录读到哪里，互不影响。`];
else if(dk>=0){const G=GR[dk],a=alive(s,G);N=['② 组内重新分工','orange',`${SV[G]} 实例 ${dk%2+1} 宕机，只有 ${GN[G]} 内部重新分工：P0–P3 全部交给 ${SH[G]} 实例 ${a[0]%2+1}。其他组完全不受影响。`]}
else if(s.ana&&s.t-s.anaAt<90)N=['④ 接入新服务','green','新加入的 analytics-group 从现在起也能收到每一条订单。Producer 和另外两个组什么都不用改，这就是第 1 课说的解耦。（新组从哪里开始读，第 16 课细讲。）'];
else N=['① 两个 Consumer Group','green',`inventory-group 和 notification-group 各有 2 个实例。每个组在组内把 4 个 Partition 分掉，所以每条订单两个组都会收到一次。试试让 Notification 的实例宕机，或者接入 Analytics。`];
api.narrate(N[0],N[2],N[1]);
api.metrics(`<div class="iso-mhead">已写入 <b>${s.total}</b> 条订单 · 每个组都会读到全部订单</div><div class="iso-mgrid">${active(s).map(G=>{const pe=pendOf(s,G),a=alive(s,G).length,tone=!a?'red':pe>8?'orange':'green',start=G==='ana'?s.anaBase:0,tot=s.total-start;return `<div class="iso-m"><div class="iso-m-h"><b>${GN[G]}</b><span class="iso-pill tone-${tone}">${a} 个实例在读</span></div><div class="iso-m-g">${SV[G]}${G==='ana'?'（接入后的订单）':''}</div><div class="iso-m-r"><span>已读 <b>${readOf(s,G)-start}</b></span><span>待读取 <b>${pe}</b></span></div><div class="iso-mbar ${tone}"><i style="width:${(tot?(readOf(s,G)-start)/tot*100:100).toFixed(1)}%"></i></div></div>`}).join('')}</div>`)},
toolbar:s=>{const nd=s.down[2]&&s.down[3];return `<button type="button" class="iso-btn ${s.down[3]?'ok':'danger'}" data-act="toggle" data-node="i3">${s.down[3]?'✓ 恢复通知实例 2':'✕ 通知实例 2 宕机'}</button><button type="button" class="iso-btn ${nd?'ok':'danger'}" data-act="grpDown">${nd?'✓ 恢复 notification-group':'✕ notification-group 全部宕机'}</button><button type="button" class="iso-btn ok" data-act="addAna" ${s.ana?'disabled':''}>${s.ana?'✓ 已接入 Analytics':'＋ 接入 Analytics（新的 group）'}</button>`},
actions:{toggle:(s,api,d)=>{const k=+d.node.slice(1);s.down[k]=!s.down[k]},grpDown:s=>{const nd=s.down[2]&&s.down[3];s.down[2]=s.down[3]=!nd},addAna:s=>{if(s.ana)return;s.ana=true;s.anaAt=s.t;s.rd.ana=s.pp.slice();s.anaBase=s.total}},
card(id,s){const own=ownership(s);if(id==='prod')return{title:'Order Service',ok:true,rows:[['角色','Producer'],['写入方式','轮流写入 P0→P3'],['已写入',s.total],['需要知道有几个组吗','不需要']]};
if(id[0]==='p'&&id!=='prod'){const p=+id.slice(1);return{title:`Partition ${p}`,ok:true,rows:[['已保存',s.pp[p]],...active(s).map(G=>[`${GN[G]} 读到`,`第 ${s.rd[G][p]} 条`])]}}
const k=+id.slice(1),m=mine(own,k),G=GR[k];return{title:`${SV[G]} 实例 ${G==='ana'?1:k%2+1}`,ok:!s.down[k],rows:[['group.id',GN[G]],['负责的 Partition',s.down[k]?'—':m.length?l3Pl(m):'无'],['已处理',s.done[k]]],actions:[{act:'toggle',label:s.down[k]?'✓ 恢复实例':'✕ 让它宕机',danger:!s.down[k]}]}}
}}
/* ===== 第 4 课：Offset 与 Lag ===== */
function lesson4LagScene(){
const PX=1,PY=3.2,PS=1.1,LX=2.9,CELL=.6,NC=8,LEND=LX+NC*CELL,PG=[2,4.4],CX=10.6,BUSX=2.2;
const prodR=(p,k)=>[[PX+PS/2,PY],[BUSX,PY],[BUSX,PG[p]],[LX+(k+.5)*CELL,PG[p]]],readR=p=>[[LEND+.15,PG[p]],[CX-.45,PG[p]]];
const fresh=()=>({t:0,slow:false,was:false,total:0,leo:[0,0],c:[0,0],hist:[]});
const lagOf=s=>s.leo[0]-s.c[0]+s.leo[1]-s.c[1],rate=s=>s.slow?2.1:12.5;
return{title:'都在 Running，Lag 却在涨',width:820,height:460,origin:[300,70],pathZ:4,ground:{gx:[-.3,11.6],gy:[.4,6.2]},
frames:[{x:[LX-.3,LEND+.3],y:[1.4,5.4]},{x:[10.05,11.15],y:[1.3,5.1]}],
platforms:[{x:[.2,1.8],y:[2.4,4]},...PG.map(g=>({x:[LX-.12,LEND+.12],y:[g-.42,g+.42]})),{x:[10.2,11],y:[1.5,4.9]}],
texts:[{at:[.2,4.45],text:'Producer'},...PG.map((g,p)=>({at:[BUSX+.06,g+.34],text:`P${p}`})),{at:[LX-.3,5.85],text:'order-events · 2 个 Partition'},{at:[11.45,5.1],text:'notification-group',dir:'gy'}],
logs:PG.map((g,p)=>({id:'p'+p,from:[LX,g],n:NC,cell:CELL,label:false,name:`Partition ${p}`,msgSize:.2,msgH:15})),
paths:[{pts:[[PX+PS/2,PY],[BUSX,PY]]},{pts:[[BUSX,PG[0]],[BUSX,PG[1]]]},...PG.map(g=>({pts:[[BUSX,g],[LX-.25,g]],arrow:true})),...PG.map(g=>({pts:[[LEND+.15,g],[CX-.6,g]],arrow:true}))],
nodes:[{id:'prod',at:[PX,PY],size:PS,h:44,label:'Order Service',state:'prod',badge:true},...PG.map((g,k)=>({id:'i'+k,at:[CX,g],size:.8,h:34,label:`Notification 实例 ${k+1}`,hideLabel:true,badge:true}))],
note:'从这一课开始，前几课说的「待读取」统一叫 <b>Lag</b>。格子下面的数字是 <b>Offset</b>，紫色小旗是 <b>Committed Offset</b>（第 3 课的小旗），深色标杆是 <b>LEO</b>。小旗到标杆之间的橙色格子，就是 Lag。',
init:()=>fresh(),
tick(s,api){s.t++;if(s.t%3===0){const p=s.total%2;s.total++;s.leo[p]++;api.emit(prodR(p,Math.min(s.leo[p],NC)-1),'prod')}
const iv=s.slow?12:2;PG.forEach((g,k)=>{if((s.t+k*5)%iv===0&&s.leo[k]>s.c[k]){s.c[k]++;api.emit(readR(k),'noti')}});
if(s.t%12===0){s.hist.push(lagOf(s));if(s.hist.length>6)s.hist.shift()}},
view(s,api){const lag=lagOf(s);
PG.forEach((g,p)=>{const n=Math.min(s.leo[p],NC),base=s.leo[p]-n,kinds=[],nums=[];for(let k=base;k<s.leo[p];k++){kinds.push(k<s.c[p]?'done':'lag');nums.push(k)}api.log('p'+p,kinds,nums);
api.logMarks('p'+p,[{pos:Math.max(0,Math.min(n,s.c[p]-base)),cls:'mk-noti',text:`${s.c[p]<base?'◂ ':''}Committed ${s.c[p]}`,h:22,right:s.c[p]<base},{pos:n,cls:'mk-leo',text:`LEO ${s.leo[p]}`,h:52,left:true}])});
api.badge('prod','写入约 4.2 条/秒','neutral');PG.forEach((g,k)=>api.badge('i'+k,`Running · P${k}`,s.slow?'orange':'green'));
const old=s.hist.length?s.hist[0]:lag,trend=lag-old>2?'上涨':old-lag>2?'下降':'持平',sec=(lag/rate(s)).toFixed(1);
const N=s.slow?['② 都在运行，但越来越晚','red',`短信供应商变慢，每个实例每秒只能处理约 1 条，比写入慢。实例状态还是 Running，没有任何报错，但总 Lag 正在${trend}：${lag} 条。按现在的速度，要大约 ${sec} 秒才能处理到最新消息，用户收到通知也就晚了这么久。所以不能只看实例活着没有，还要盯 Lag，并看它是在涨还是在降。`]
:s.was&&lag>2?['③ 恢复后 Lag 下降','orange',`短信供应商恢复，处理速度回到每个实例约 6 条/秒，比写入快，Lag 正在${trend}：还剩 ${lag} 条，约 ${sec} 秒能追上。`]
:['① 正常读取','green',`两个实例各读一个 Partition，Committed Offset 紧跟着 LEO，Lag 只有 ${lag} 条。注意小旗上的数字：处理完 #${Math.max(0,s.c[0]-1)}，提交的是 ${s.c[0]}，表示「下一条该读 #${s.c[0]}」。点击「短信供应商变慢」。`];
api.narrate(N[0],N[2],N[1]);
const pad=(v,w)=>String(v).padEnd(w);
api.metrics(`<div class="iso-term"><span class="cmd">$ kafka-consumer-groups.sh --describe --group notification-group</span>\n${pad('TOPIC',14)}${pad('PARTITION',11)}${pad('CURRENT-OFFSET',16)}${pad('LOG-END-OFFSET',16)}LAG\n${PG.map((g,p)=>`${pad('order-events',14)}${pad(p,11)}${pad(s.c[p],16)}${pad(s.leo[p],16)}<span class="hl">${s.leo[p]-s.c[p]}</span>`).join('\n')}\n<span class="note"># 总 Lag ${lag} 条 · 趋势：${trend} · 处理速度约 ${rate(s)} 条/秒 · 预计延迟约 ${sec} 秒</span></div>`)},
toolbar:s=>`<button type="button" class="iso-btn ${s.slow?'ok':'danger'}" data-act="slow">${s.slow?'✓ 短信供应商恢复':'🐢 短信供应商变慢'}</button>`,
actions:{slow:s=>{s.slow=!s.slow;if(!s.slow)s.was=true;s.hist=[]}},
card(id,s){if(id==='prod')return{title:'Order Service',ok:true,rows:[['角色','Producer'],['写入','轮流写入 P0、P1'],['速度','约 4.2 条/秒']]};
if(id[0]==='p'&&id!=='prod'){const p=+id.slice(1);return{title:`Partition ${p}`,ok:true,rows:[['LEO（下一条写入位置）',s.leo[p]],['Committed Offset',s.c[p]],['Lag',s.leo[p]-s.c[p]],['最早的 Offset','0']]}}
const k=+id.slice(1);return{title:`Notification 实例 ${k+1}`,ok:true,rows:[['负责的 Partition',`P${k}`],['Committed Offset',s.c[k]],['Lag',s.leo[k]-s.c[k]],['处理速度',s.slow?'约 1 条/秒（变慢）':'约 6 条/秒']]}}
}}
function lesson4CommitScene(){
const PX=1,PY=3.2,PS=1.1,LX=2.9,CELL=.6,NC=10,LEND=LX+NC*CELL,CX=10.5;
const prodR=k=>[[PX+PS/2,PY],[LX+(k+.5)*CELL,PY]],readR=[[LEND+.15,PY],[CX-.5,PY]];
const fresh=prev=>({t:0,leo:0,pos:0,done:0,c:0,mode:prev?prev.mode:1,step:null,stepT:0,cur:-1,down:0,rereadEnd:0,dup:0,crash:null,restartAt:-999,commits:0});
return{title:'拉取 → 处理 → 提交：崩溃后从哪里继续',width:720,height:430,origin:[250,60],pathZ:4,ground:{gx:[-.3,11.6],gy:[1.4,5]},
frames:[{x:[LX-.3,LEND+.3],y:[2.55,4.3]}],
platforms:[{x:[.2,1.8],y:[2.4,4]},{x:[LX-.12,LEND+.12],y:[PY-.42,PY+.42]},{x:[9.9,11.1],y:[2.6,3.8]}],
texts:[{at:[.2,4.45],text:'Producer'},{at:[LX-.3,4.72],text:'order-events · Partition 0（放大看）'}],
logs:[{id:'p0',from:[LX,PY],n:NC,cell:CELL,label:false,name:'Partition 0',msgSize:.2,msgH:15}],
paths:[{pts:[[PX+PS/2,PY],[LX-.2,PY]],arrow:true},{pts:[[LEND+.15,PY],[CX-.62,PY]],arrow:true}],
nodes:[{id:'prod',at:[PX,PY],size:PS,h:44,label:'Order Service',state:'prod'},{id:'inst',at:[CX,PY],size:.9,h:36,label:'Notification 实例',badge:true}],
init:prev=>fresh(prev),
tick(s,api){s.t++;if(s.t%10===0){s.leo++;api.emit(prodR(Math.min(s.leo,NC)-1),'prod')}
if(s.down>0){s.down--;if(!s.down){s.pos=s.c;s.done=s.c;s.step=null;s.restartAt=s.t}return}
if(!s.step){if(s.pos<s.leo){s.cur=s.pos;s.pos++;s.step='fetch';s.stepT=0;api.emit(readR,'noti')}return}
s.stepT++;
if(s.step==='fetch'&&s.stepT>=2){s.step='proc';s.stepT=0}
else if(s.step==='proc'&&s.stepT>=4){if(s.cur<s.rereadEnd)s.dup++;s.done=s.cur+1;if(s.done-s.c>=s.mode){s.step='commit';s.stepT=0}else s.step=null}
else if(s.step==='commit'&&s.stepT>=2){s.c=s.done;s.commits++;s.step=null}},
view(s,api){const n=Math.min(s.leo,NC),base=s.leo-n,kinds=[],nums=[],busy=!s.down&&(s.step==='fetch'||s.step==='proc');
for(let k=base;k<s.leo;k++){kinds.push(busy&&k===s.cur?'cur':k<s.c?'done':k<s.done?'unc':k<s.rereadEnd?'reread':'lag');nums.push(k)}api.log('p0',kinds,nums);

/* ===== 第 5 课：提交顺序与幂等 ===== */
const l5Sum=o=>Object.values(o).reduce((a,v)=>a+v,0),l5Dup=o=>Object.values(o).reduce((a,v)=>a+Math.max(0,v-1),0);
const l5Kinds=(s,n,base,busy)=>{const kinds=[],nums=[];for(let k=base;k<s.leo;k++){const v=s.sms[k]||0;kinds.push(busy&&k===s.cur?'cur':v>=2?'dup':k<s.c&&!v?'miss':v&&k<s.c?'done':v?'unc':'lag');nums.push(k)}return[kinds,nums]};
const l5Kv=(l,v,c='')=>`<div class="${c}"><small>${l}</small><b>${v}</b></div>`;
function lesson5OrderScene(){

logs:[{id:'p0',from:[LX,PY],n:NC,cell:CELL,label:false,name:'Partition 0',msgSize:.2,msgH:15}],
paths:[{pts:[[PX+PS/2,PY],[LX-.2,PY]],arrow:true},{pts:[[LEND+.15,PY],[CX-.62,PY]],arrow:true},{pts:[[CX+.45,PY],[PH-.45,PY]],arrow:true}],

/* ===== 第 11 课：Producer 重试与幂等 ===== */
function lesson11Scene(mode){

const L=(s,m)=>{s.plog.push(m);if(s.plog.length>5)s.plog.shift()};
function send(s,api,m,retry){s.k++;const lost=s.jitter&&s.k%4===2;s.reqs.push({...m,arrive:s.t+TRAVEL,lost,k:s.k});const f=s.inflight.find(x=>x.id===m.id&&x.seq===m.seq);if(f){f.sentAt=s.t}else s.inflight.push({...m,sentAt:s.t});if(retry)s.retries++;else s.sent++;api.emit(lost?reqLost:reqR,lost?'fail':'prod')}
function append(s,m){s.log.push({id:m.id,dup:!!s.seen[m.id],ooo:m.id<s.maxId&&!s.seen[m.id]});if(s.seen[m.id])s.dup++;else if(m.id<s.maxId)s.ooo++;s.seen[m.id]=1;s.maxId=Math.max(s.maxId,m.id)}
return{title:A?'确认丢了，Producer 重试写出了重复':'幂等 Producer：PID + 序号',width:660,height:400,origin:[225,40],pathZ:6,ground:{gx:[-.3,11.2],gy:[1.8,4.8]},
platforms:[{x:[.2,1.8],y:[2.4,4]},{x:[4.6,5.8],y:[2.6,3.8]},{x:[LX-.12,LEND+.12],y:[PY-.36,PY+.36]}],
texts:[{at:[.2,4.45],text:'Producer'},{at:[1.9,RQ-.1],text:'请求'},{at:[1.9,AK+.45],text:'确认 ACK'},{at:[LX,4.42],text:'Broker 上 Partition 0 的日志（格子下面是订单号）'}],
logs:[{id:'p0',from:[LX,PY],n:NC,cell:CELL,label:false,name:'Partition 0',msgSize:.16,msgH:13,numOff:.3}],
paths:[{pts:reqR,arrow:true},{pts:ackR,arrow:true,kind:'back'},{pts:[[BX+.55,PY],[LX-.2,PY]],arrow:true}],
nodes:[{id:'prod',at:[PX,PY],size:PS,h:44,label:'Order Service（Producer）',state:'prod',badge:true},{id:'broker',at:[BX,PY],size:1,h:50,label:'Broker（P0 的 Leader）',badge:true,rack:true}],
note:A?'这里 Producer 用的是 acks=all（第 7 课）。紫色实线是请求，绿色虚线是确认（ACK）；红色小方块表示在路上丢了。日志里的红色格子是重复写入的订单，黄色格子是顺序被打乱的订单。':'<code>enable.idempotence</code> 要求 <code>acks=all</code>，Kafka 3.0 起默认就是开启的。PID 在 Producer 重启后会变，所以它挡不住「跨重启」的重复，那要靠第 18 课的事务（transactional.id）或 Consumer 端去重。',
init:prev=>fresh(prev),
tick(s,api){s.t++;
if(s.t%6===0)s.queue.push({id:s.nextId++,seq:s.nextSeq++});
while(s.inflight.length<s.maxIn&&s.queue.length)send(s,api,s.queue.shift(),false);
s.reqs=s.reqs.filter(r=>{if(r.arrive>s.t)return true;if(r.lost){L(s,`请求 #${r.id} 在路上丢了`);return false}
 let ok=true,msg='';
 if(s.idem){if(r.seq<=s.lastSeq){s.ignored++;msg=`Broker：PID ${s.pid} seq ${r.seq} 已经写过，忽略重复，直接回成功`}else if(r.seq===s.lastSeq+1){s.lastSeq=r.seq;append(s,r)}else{ok=false;s.rejected++;msg=`Broker：期望 seq ${s.lastSeq+1}，收到 ${r.seq} → OutOfOrderSequence，让 Producer 按顺序重发`}}
 else append(s,r);
 if(msg)L(s,msg);
 const ackLostNow=s.jitter&&r.k%4===0&&ok;s.acks.push({id:r.id,seq:r.seq,arrive:s.t+TRAVEL,lost:ackLostNow,ok});api.emit(ackLostNow?ackLost:ackR,ackLostNow?'fail':ok?'cons':'fail');if(ackLostNow)L(s,`#${r.id} 已经写进日志，但 ACK 在路上丢了`);return false});
if(s.appBump&&!s.queue.length){s.maxIn--;s.appBump=0}
s.acks=s.acks.filter(a=>{if(a.arrive>s.t)return true;if(a.lost)return false;const i=s.inflight.findIndex(x=>x.id===a.id&&x.seq===a.seq);if(i<0)return false;
 if(a.ok){s.inflight.splice(i,1);s.lastAcked=a.id}else{s.inflight[i].sentAt=s.t-TIMEOUT+5}return false});
s.inflight.forEach(f=>{if(s.t-f.sentAt>TIMEOUT){L(s,`#${f.id} 等确认超时 → 自动重试（seq ${f.seq} 不变）`);send(s,api,f,true)}})},
view(s,api){const w=s.log.slice(-NC);api.log('p0',w.map(e=>e.dup?'dup':e.ooo?'reread':'done'),w.map(e=>'#'+e.id));
api.badge('prod',s.idem?`幂等：开 · PID ${s.pid} · seq ${s.nextSeq-1}`:`幂等：关 · in-flight ${s.maxIn}`,s.idem?'green':'neutral');
api.badge('broker',s.idem?`PID ${s.pid} 最后 seq ${s.lastSeq}`:'不检查重复',s.idem?'green':'neutral');
const recentApp=s.t-s.appAt<130;let N;
if(!s.jitter)N=['① 正常发送','green','Producer 发出一条消息，Broker 写入后回一个确认（ACK，绿色）。收不到确认时 Producer 会自动重试：retries 默认几乎无限，真正限制总时长的是 delivery.timeout.ms（默认 2 分钟）。打开「网络抖动」。'];
else if(!s.idem)N=s.dup||s.ooo?['② 确认丢了，重试写出了重复','red',`网络抖动时，有的请求在路上丢了，有的确认丢了。确认丢了的那条其实已经写进去了，可 Producer 不知道，超时后重发，Broker 又写了一遍：日志里出现了 ${s.dup} 条重复（红色）。${s.ooo?`而且一次最多 ${s.maxIn} 个请求同时在路上（max.in.flight），前一条请求丢了要重发，后面的已经先写进去了，顺序也乱了 ${s.ooo} 次（黄色，第 10 课说的「重试打乱顺序」）。`:''}`]:['② 网络抖动','orange','网络开始抖动：有的请求在路上丢失，有的确认（ACK）丢失。留意 Producer 的日志和右边的格子。'];
else if(recentApp)N=['③ 应用自己又发了一次','red',`应用代码在异常处理里又调用了一次 send()（或者用户重复点击、服务重启后重放）：对 Kafka 来说这是一条带新序号（seq ${s.appSeq}）的新消息，不是重试，幂等 Producer 不会拦它，它会作为又一条 #${s.appId} 写进日志（红色重复格子）。协议层的幂等只管「同一次发送的重试」；业务上的重复，要靠消息里的 eventId 在 Consumer 端去重（第 5 课）。`];
else N=['① 幂等 Producer','green',`打开 enable.idempotence 后，Producer 启动时拿到一个 Producer ID（PID），每条消息带上递增的序号（seq）。Broker 按「PID + Partition」记住最后写入的序号：重试的序号已经写过，就直接回成功、不再追加（已忽略 ${s.ignored} 次）；序号跳号了就拒绝，让 Producer 按顺序重发（已拒绝 ${s.rejected} 次）。网络再抖，日志里重复 ${s.dup} 条、乱序 ${s.ooo} 次。`];
api.narrate(N[0],N[2],N[1]);
api.metrics(`<div class="iso-term"><span class="note"># Producer / Broker 日志</span>\n${s.plog.join('\n')||'…'}</div><div class="iso-kv c4" style="margin-top:10px">${l5Kv('新消息',s.sent)}${l5Kv('自动重试',s.retries,s.retries?'hl':'')}${l5Kv('日志里的重复',s.dup,s.dup?'warn':'')}${l5Kv('顺序被打乱',s.ooo,s.ooo?'warn':'')}</div>`)},
toolbar:s=>{const j=`<button type="button" class="iso-btn ${s.jitter?'danger':'ok'}" data-act="jitter">网络抖动：${s.jitter?'开':'关'}</button>`;
 if(A)return j+`<span class="iso-seg" role="group" aria-label="max.in.flight">${[1,5].map(v=>`<button type="button" data-act="inflight" data-v="${v}" aria-pressed="${s.maxIn===v}">max.in.flight = ${v}</button>`).join('')}</span>`;
 return `<button type="button" class="iso-btn ${s.idem?'ok':'danger'}" data-act="idem">enable.idempotence：${s.idem?'开':'关'}</button>${j}<button type="button" class="iso-btn danger" data-act="app">↻ 应用代码又 send 了一次</button>`},
actions:{jitter:s=>{s.jitter=!s.jitter},inflight:(s,api,d)=>+d.v===s.maxIn?undefined:fresh({jitter:s.jitter,maxIn:+d.v}),idem:s=>fresh({idem:!s.idem,jitter:s.jitter,maxIn:5}),

 let act=[...Array(NP).keys()].filter(p=>p!==stuckP&&s.lags[p]>0),used=0;
 for(let it=0;it<3&&act.length&&budget-used>1e-6;it++){const share=(budget-used)/act.length;act.forEach(p=>{const d=Math.min(share,s.lags[p]);s.lags[p]-=d;used+=d});act=act.filter(p=>s.lags[p]>1e-6)}
 s.cons=used;s.dbUtil=s.pause?0:Math.min(1,used/dEff);s.cpuBound=cpuBound;s.dEff=dEff;s.cpuUse=s.pause?0:used/(s.n*s.cap);

else if(s.wrong&&recent)N=['✕ 加实例没用','red',D==='mysql'?'实例变多，MySQL 更挤，消费速率反而下降（就是第一张图）。':D==='reb'?'新实例加入又触发了一次 Rebalance；被踢出组的根因（处理太慢、超过 max.poll.interval.ms）还在，Lag 照样锯齿状上涨。':'P3 只能由一个实例读（第 2 课），加多少实例，那条坏消息还是卡在那里。'];
else N={peak:['症状：写入高峰','orange','写入速率明显高于消费速率；8 个 Partition 的 Lag 一起涨；Consumer CPU 接近 100%，MySQL 很轻松。→ 结论：Consumer 处理能力不够。加实例（不超过 Partition 数，第 2 课），或者优化处理逻辑。'],
mysql:['症状：下游变慢','orange','消费速率被卡在一个固定值；Consumer CPU 很低（都在等数据库）；MySQL CPU 95%、耗时几百毫秒、连接池用满。→ 结论：瓶颈在下游。优化 SQL、加索引、扩容数据库，或者先限流保护它（第 15 课）。'],

stuck:['症状：只有一个 Partition 的 Lag 在涨','orange','其他 Partition 的 Lag 都是 0，只有 P3 一直涨；错误和重试次数不断增加。→ 结论：P3 上某条消息一直处理失败，卡住了后面所有消息（毒丸，第 14 课）。如果错误不多、只是 P3 的写入量特别大，那是热点 Partition（第 13 课）。'],}[D];
api.narrate(N[0],N[2],N[1]);

api.metrics(`<div class="dash"><div class="dash-h">监控面板 · notification-group</div><div class="dash-g">${tile('写入速率',fmt(rateIn)+' /秒','ok')}${tile('消费速率',fmt(rateOut)+' /秒',rateOut<rateIn*.97?'bad':'ok')}${tile('总 Lag（趋势）',`${fmt(L*K)}（${trend}）`,trend==='上涨'?'bad':trend==='下降'?'ok':'')}${tile('Consumer CPU',cpuC+'%',cpuC>85?'bad':'ok')}${tile('MySQL CPU / 耗时',`${cpuDB}% / ${lat}ms`,cpuDB>90?'bad':'ok')}${tile('连接池',`${pool} / 50`,pool>=50?'bad':'ok')}${tile('Rebalance 次数',s.reb,s.reb>1?'bad':'ok')}${tile('处理错误 / 重试',s.err,s.err>20?'bad':'ok')}</div><div class="dash-h" style="margin-top:10px">各 Partition 的 Lag</div><div class="dash-bars">${s.lags.map((v,p)=>`<div><i style="height:${(v/mx*100).toFixed(0)}%" class="${v>2*avg&&v>3?'hot':''}"></i><span>P${p}</span></div>`).join('')}</div></div>`)},

/* ===== 第 15 课：Backpressure ===== */
function lesson15Scene(mode){

 if(s.down){succ=0}else{const C=DBC(s),r=offered/C;s.r=r;succ=r<=1?offered:C*Math.max(.35,1-.45*(r-1))}

 s.succ=succ;s.att=offered;s.paused=paused;
 const tgt=s.down?(paused?0:3000):s.r<=1?20+s.r*30:Math.min(3000,50+(s.r-1)*1500);s.lat+= (tgt-s.lat)*.15;

note:A?'数字按真实规模换算，画面里的 1 秒 ≈ 真实的 1 分钟。MySQL 每秒最多稳定写入约 5,000 条，三个实例每秒能处理约 15,000 条。':'画面里的 1 秒 ≈ 真实的 1 分钟。限流的额度是「全组合计」：3 个实例共享 5,000 条/秒，每个实例约 1,650 条/秒，不是每个实例各 5,000。',

tick(s,api){s.t++;step(s);s.pAcc+=IN(s)/3000;if(s.pAcc>=3){s.pAcc=0;api.emit([[PX+PS/2,PY],[LX+(NC-.5)*CELL,PY]],'prod')}

{name:'读 → 处理 → 写的缺口',tone:'prod',tag:'at-least-once',what:'「写输出」和「提交 Offset」是两步，中间崩溃就会重复：',points:['先写输出、后提交 Offset：崩溃后重读，输出重复（本课第一张图）。','先提交 Offset、后写输出：崩溃后这条再也不会处理，丢消息（第 5 课）。','幂等 Producer 挡不住：这是应用重新发送，而且重启后 PID 变了（第 11 课）。'],scene:'本课画面：第一张图里红色的重复订单。'},
{name:'Kafka 事务怎么用',tone:'kafka',tag:'一起提交',what:'Producer 配置 <code>transactional.id</code>，Consumer 关掉自动提交：',points:['<code>beginTransaction()</code> → <code>send()</code> 输出 → <code>sendOffsetsToTransaction()</code> 把输入 Offset 交给事务 → <code>commitTransaction()</code>。','Transaction Coordinator 记录事务状态，提交或中止时往相关 Partition 写一个标记。','同一个 transactional.id 重启时，旧的未完成事务会被中止，还活着的旧实例会被隔离（fencing），防止「僵尸」写入。','Kafka Streams 里只要设 <code>processing.guarantee=exactly_once_v2</code>。'],scene:'本课画面：上方的 Transaction Coordinator。'},
{name:'read_committed',tone:'cons',tag:'下游要配合',what:'Consumer 的 <code>isolation.level</code> 决定能不能看到未提交的消息：',points:['<b>read_committed：</b>跳过被中止事务的消息；遇到还没结束的事务会先停住，等它有结果。','<b>read_uncommitted（默认）：</b>什么都读，包括后来被中止的消息。','事务越长，read_committed 的读者等得越久，Lag 也会跟着涨（第 12 课）。'],scene:'本课画面：第二张图的 isolation.level 切换。'},
{name:'边界：外部系统',tone:'part',tag:'幂等 / Outbox',what:'Kafka 事务只管 Kafka 里的读和写：',points:['MySQL 更新、发短信、调用支付接口都不在事务里，Kafka 事务中止不会回滚它们。','办法一：幂等。按 eventId 记录已处理，和业务更新放在同一个数据库事务里（第 5 课）。','办法二：Outbox。只写数据库（业务表 + outbox 表在同一个事务），再由 CDC（比如 Debezium）把 outbox 里的事件发到 Kafka。','「exactly-once」说的是效果上只生效一次，不是消息只被处理一次。'],scene:'本课画面：「还要扣 MySQL 库存」。'}],
compare:{head:['做法','inventory-events 里','Shipping（read_committed）','MySQL 库存'],rows:[['没有事务','同一订单写两次','发两次货','—'],['Kafka 事务','旧的那条被中止','只发一次货','—'],['Kafka 事务 + 扣 MySQL','旧的那条被中止','只发一次货','多扣一次'],['Kafka 事务 + MySQL 幂等去重','旧的那条被中止','只发一次货','只扣一次']]},
key:'Kafka 事务让输出消息和输入 Offset 一起提交，下游要用 read_committed；事务的边界是 Kafka 本身，外部系统要靠幂等或 Outbox。'},
17:{compareTitle:'常见改动的兼容性（Avro）',comparePlain:true,
terms:[
{name:'Schema 是消息的契约',tone:'kafka',tag:'字段 · 类型 · 默认值',what:'Schema 描述消息里有哪些字段、什么类型、是否必填、默认值是什么。',points:['Kafka 只存字节，不检查内容；格式对不对，要到 Consumer 解析时才知道。','Producer 和各个 Consumer 组独立部署，不可能同时升级。','日志只追加、不能修改：写进去的旧格式消息会一直留到过期，重放（第 9 课）时还要能读。'],scene:'本课画面：第一张图卡住的 v2 消息。'},
{name:'兼容性的三个方向',tone:'cons',tag:'谁读谁',what:'改 Schema 之前，先问「新旧代码能不能读对方的数据」：',points:['<b>Backward（向后兼容）：</b>新代码能读旧数据。先升级 Consumer，再升级 Producer。','<b>Forward（向前兼容）：</b>旧代码能读新数据。先升级 Producer，再升级 Consumer。','<b>Full：</b>两个方向都满足，发布顺序随意。'],scene:'本课画面：第二张图的「发布顺序」。'},
{name:'Schema Registry',tone:'part',tag:'注册时检查',what:'集中保存每个 Topic 的 Schema 版本（subject，比如 order-events-value）：',points:['Producer 序列化时注册（或查到）Schema，消息里只带 schema id；Consumer 按 id 取回 Schema 解析。','注册新版本时按兼容模式检查，不兼容就返回 409，坏格式进不了 Topic。','默认模式 BACKWARD 只和上一个版本比；带 _TRANSITIVE 的模式和所有历史版本比。','生产环境常关掉自动注册（auto.register.schemas=false），在 CI 里先检查兼容性再注册。'],scene:'本课画面：左上角的 Schema Registry。'},
{name:'安全的改法',tone:'prod',tag:'只加不改',what:'几条经验：',points:['新字段一律带默认值，这样新旧双向都能读。','不要改字段类型；要改就新加一个字段，老字段先保留、标记废弃，等下游都切过去再删。','改名 = 删一个字段 + 加一个字段，同样要按兼容规则走。','真不兼容的改动：建新 Topic（比如 order-events-v2），双写一段时间，让下游逐个迁移。','兼容检查只看结构，不看含义：金额从「元」改成「分」，Registry 拦不住。'],scene:'本课画面：「改字段类型」总是被拒绝。'}],
compare:{head:['改动','新读旧（Backward）','旧读新（Forward）','能用的模式 / 发布顺序'],rows:[['新增可选字段（有默认值）','✓','✓','FULL：顺序随意'],['新增必填字段（没有默认值）','✕','✓','FORWARD：先升级 Producer'],['删除字段（没有默认值）','✓','✕','BACKWARD：先升级 Consumer'],['修改字段类型（int → string）','✕','✕','都不行：新加字段或新 Topic']]},
key:'Schema 变更先过兼容检查，再按方向决定发布顺序：Backward 先升级 Consumer，Forward 先升级 Producer。不兼容的改动不要原地改，用新字段或新 Topic。'},
16:{compareTitle:'三种取值在不同情况下的起点',comparePlain:true,
terms:[
{name:'group.id 是 Offset 的「身份」',tone:'kafka',tag:'位置跟着组走',what:'Committed Offset 存在 Kafka 内部的 <code>__consumer_offsets</code> Topic 里，按「group.id + Topic + Partition」保存。',points:['同一个 group.id：分工读、共用一份位置（第 3 课）。','换一个 group.id：Kafka 把它当成全新的组，老组的位置不会自动继承。','组里没有成员超过 <code>offsets.retention.minutes</code>（默认 7 天），它的位置也会被清理（第 9 课）。'],scene:'本课画面：第二张图上方的 __consumer_offsets。'},
{name:'auto.offset.reset',tone:'cons',tag:'找不到位置时的兜底',what:'Consumer 端配置，三个常用取值：',points:['<b>earliest：</b>从 log start（最早还在的消息）开始。','<b>latest：</b>从 LEO 开始，只读以后的新消息。Java Consumer 的默认值。','<b>none：</b>不猜，直接抛异常，让人来决定。','命令行 <code>kafka-console-consumer.sh</code> 加 <code>--from-beginning</code> 相当于 earliest；Kafka 4.0 起还可以用 <code>by_duration:PT1H</code> 这样的写法，从一段时间之前开始读。'],scene:'本课画面：第二张图右边的 earliest / latest / none。'},
{name:'什么时候才会用到它',tone:'part',tag:'只在没有有效位置时',what:'只有这几种情况：',points:['新的 group.id 第一次启动。','组的 Offset 过期被删了（offsets.retention.minutes）。','提交的位置已经被保留规则清理，读取时遇到 OffsetOutOfRange（第 9 课）。','已有有效 Offset 的组，改这个配置不会改变起点。要调整位置，先停掉组，再用 <code>kafka-consumer-groups.sh --reset-offsets</code>，或在代码里 <code>seek()</code>。'],scene:'本课画面：终端里的判断过程。'},
{name:'怎么选、怎么迁移',tone:'prod',tag:'别让它替你猜',what:'按业务对「漏」和「重」的容忍度来选：',points:['关键业务（订单、支付、通知）：用 none，或者上线前把位置设好，再启动。','新服务补历史：earliest，处理逻辑要幂等（第 5 课）。','只关心实时数据（比如实时大盘）：latest 可以接受。','尽量不要改 group.id。非改不可：先停掉老组，用 <code>--reset-offsets --to-offset</code>（多个 Partition 用 <code>--export</code> / <code>--from-file</code>）给新组设好位置；上线后用 <code>--describe</code> 确认新组的起点。'],scene:'本课画面：「新 group.id + 先设好 Offset」。'}],
compare:{head:['情况','earliest','latest','none'],rows:[['有有效的 Committed Offset','从 Committed 接着读','从 Committed 接着读','从 Committed 接着读'],['新 group.id（没有记录）','从 log start 读全部历史，可能重复处理','从 LEO 开始，跳过全部历史','抛 NoOffsetForPartitionException'],['提交的位置已被清理','跳到 log start，被清理的已经没了','跳到 LEO，丢得更多','抛 OffsetOutOfRangeException']]},
key:'auto.offset.reset 只在找不到有效 Committed Offset 时才起作用，改它不会覆盖已有的 Group Offset。换 group.id 等于从零开始，迁移前先把位置设好。'},
15:{compareTitle:'三种做法对比（大促 12,000 条/秒）',comparePlain:true,
terms:[
{name:'不加控制会怎样',tone:'prod',tag:'越忙越慢',what:'Consumer 处理得比下游快，就会把下游压垮：',points:['MySQL 超时、连接池耗尽；失败的请求被重试，负载更高，实际写成功的反而更少，甚至拖垮整个数据库（雪崩）。','单条处理太慢，两次 poll() 间隔超过 max.poll.interval.ms，实例被踢出组，触发 Rebalance（第 8 课）。','先读进内存的无界队列里再慢慢写？内存会被撑爆，实例重启后这些消息还得重读。'],scene:'本课画面：第一张图的红色 MySQL。'},
{name:'Backpressure 的几种做法',tone:'cons',tag:'让上游慢下来',what:'按下游的能力控制消费速度：',points:['<b>限流：</b>令牌桶，额度按全组合计（3 个实例共享 5,000 条/秒），不是每个实例各 5,000。','<b>限制并发 / 有界队列：</b>同时写 MySQL 的请求数有上限，队列满了就停止读取。','<b>pause / resume：</b>暂停某些 Partition 时继续调用 poll()（不返回这些 Partition 的消息，只维持心跳），恢复后 resume()。','<b>熔断：</b>下游不可用时暂停消费，而不是每条都重试到进 DLT（第 14 课）。'],scene:'本课画面：第二张图的限流器和「MySQL 故障」。'},
{name:'Kafka 是缓冲区，但有限',tone:'kafka',tag:'算账',what:'限流后，多出来的消息在 Kafka 里排队：',points:['Lag 会持续上涨（第 4、12 课），要看「Lag 换算成时间」。','积压的时间必须远小于 Topic 的保留期，否则还没处理就被删了（第 9 课）。','追平时间 = 积压 ÷（处理速度 − 写入速度）。'],scene:'本课画面：中间的积压格子和监控面板。'},
{name:'限流不解决容量缺口',tone:'part',tag:'提升处理能力',what:'如果写入长期高于处理能力，限流只是在拖延：',points:['提升下游能力：批量写入、优化 SQL 和索引、数据库扩容。','提升 Consumer 能力：加 Partition 和实例（第 2 课），前提是下游扛得住。','Producer 端也有背压：发送缓冲区 buffer.memory 满了，send() 最多阻塞 max.block.ms 后报错。'],scene:'本课画面：「限流 + 批量写入」。'}],
compare:{head:['做法','MySQL','Lag','评价'],rows:[['不限流','超负荷，超时、重试、可能雪崩','实际写成功更少，反而涨得更快','不可取'],['限流 5,000/秒','稳定','每秒涨约 7,000，高峰后慢慢追平','短期高峰可用'],['限流 + 批量写入','稳定','每秒涨约 3,000','推荐，同时提升处理能力']]},
extra:'<div class="rv-formula"><b>算一笔账：</b>大促持续 2 小时，写入 12,000 条/秒，限流 5,000 条/秒 → 每秒积压 7,000 条，2 小时约 5,040 万条。高峰过后写入回到 3,000 条/秒，处理 5,000 条/秒，每秒只能追回 2,000 条，要约 7 小时才能追平。也就是说最早的消息要等 9 个小时左右才被处理：保留期必须远大于这个时间（第 9 课），并且考虑大促期间临时提升处理能力。</div>',
key:'Backpressure 让消息先在 Kafka 里排队，保护下游；但它不解决长期容量缺口，要盯住 Lag 换算成的时间、保留期和追平时间。'},
14:{compareTitle:'出错时的几种写法',comparePlain:true,
terms:[
{name:'Poison Pill',tone:'prod',tag:'毒丸',what:'重试多少次都不会成功的消息：格式错误的 JSON、缺字段、校验不通过、业务上不可能的数据。',points:['一直重试它，Consumer 就不提交 Offset，整个 Partition 被堵住（第 4、12 课）。','反序列化失败发生在你的处理代码之前，要单独处理（比如 Spring Kafka 的 ErrorHandlingDeserializer）。'],scene:'本课画面：第一张图里红色的 #6。'},
{name:'暂时错误 vs 永久错误',tone:'cons',tag:'先分类',what:'处理方式完全不同：',points:['<b>暂时错误：</b>数据库超时、网络抖动、下游返回 503、被限流。有限次重试 + 指数退避（1 秒、2 秒、4 秒……再加一点随机抖动）。','<b>永久错误：</b>格式错、校验不通过。不重试或只试一次，直接进 DLT。','下游长时间不可用时，不要每条都重试到进 DLT，应该暂停消费、保护下游（第 15 课）。','也可以用单独的「重试 Topic」（如 retry-5s、retry-1m）做不阻塞的重试，代价是失去顺序。'],scene:'本课画面：黄色格子在退避重试。'},
{name:'死信 Topic（DLT）',tone:'kafka',tag:'隔离坏消息',what:'专门存放处理不了的消息的 Topic，比如 order-events.DLT。',points:['写进去的要有：原消息、原 Topic / Partition / Offset、异常信息、时间（放在 header 里）。','<b>先确认 DLT 写成功，再提交原 Offset</b>，否则这条消息就丢了。','DLT 要有告警、查看和处理流程；修好后可以重放回来（第 9 课），重放要幂等（第 5 课）。'],scene:'本课画面：下面那条 order-events.DLT。'},
{name:'顺序怎么办',tone:'part',tag:'按 Key 暂停',what:'把一条事件挪进 DLT，同一订单后面的事件还会照常处理：',points:['比如「创建」进了 DLT，「付款」照常处理，订单服务就会报「订单不存在」（第 10 课）。','需要订单级顺序时，把同一 Key 的后续事件也停住（一起进 DLT 或暂停区），处理好后按顺序重放。','DLT 是隔离故障的手段，不保证顺序，也不保证恰好一次。'],scene:'本课画面：第二张图的「按订单暂停」。'}],
compare:{head:['写法','Partition 会不会卡住','消息会不会丢','评价'],rows:[['失败就一直重试','会，毒丸把它卡死','不会','不可取'],['catch 住直接跳过','不会','会，而且没人知道','不可取'],['有限重试 + DLT','不会','不会，在 DLT 里等处理','推荐'],['有限重试 + DLT + 按 Key 暂停','只停这一个 Key','不会','需要订单级顺序时']]},
key:'重试只对暂时错误有意义；永久错误进 DLT，确认写成功后再提交 Offset。DLT 是隔离故障的手段，不自动保证顺序或恰好一次。'},
13:{compareTitle:'三种 Key 对比',comparePlain:true,
terms:[
{name:'热点 Partition',tone:'prod',tag:'负载不均',what:'某个 Partition 的写入量远超其他 Partition，处理它的那个实例跟不上。',points:['常见原因：Key 太粗（比如事件类型，第 10 课），或者某个 Key 本身就特别大（大商户、爆款商品、明星用户）。','症状：只有一个 Partition 的 Lag 在涨，它的实例满负荷，其他实例很闲（第 12 课）。','这个 Partition 的 Leader 所在的 Broker 也会比别的 Broker 更忙（第 6 课）。'],scene:'本课画面：红色的格子带和橙色的实例。'},
{name:'为什么加实例、加 Partition 没用',tone:'cons',tag:'同一个 Key 只去一个地方',what:'单个热点 Key 拆不开：',points:['同一个 Key 总是落到同一个 Partition，一个 Partition 同一时间只交给组里一个实例（第 2 课）。','加实例：多出来的实例要么空闲，要么分到冷 Partition。','加 Partition：热点 Key 只是换了个号码，还会打乱已有 Key 的映射（第 10 课）。'],scene:'本课画面：第一张图的两个按钮。'},
{name:'怎么发现',tone:'kafka',tag:'看分布',what:'定位热点要看「每个 Partition」，不能只看总数：',points:['每个 Partition 的写入速率（Broker 指标 MessagesInPerSec、BytesInPerSec 可以按 Topic / Partition 看）和 Lag。','抽样统计 Key 的分布，找出占比最高的几个 Key。','热点 Partition 的写入速率是否超过了单个实例的处理能力。'],scene:'本课画面：监控面板的两组柱状图。'},
{name:'怎么拆',tone:'part',tag:'换 Key',what:'按业务需要的顺序范围来选：',points:['<b>换更细的 Key：</b>只需要订单级顺序，就用订单号。','<b>热点 Key 加盐：</b>Key = 商户号 + 分片号（比如订单号 % 4），只对热点商户启用；代价是商户内只在同一分片内有序。','<b>单独通道：</b>给超大客户单独的 Topic，或者写自定义分区器。','<b>迁移要小心：</b>换 Key 和扩 Partition 一样会打乱映射，切换时先停写，或等进行中的订单处理完，或写新 Topic 后逐步切换。'],scene:'本课画面：第二张图的三种 Key。'}],
compare:{head:['','Key = 商户号','Key = 订单号','Key = 商户号 + 分片号'],rows:[['负载分布','大商户集中在一个 Partition','均匀','热点商户被拆到几个 Partition'],['顺序范围','同一商户的订单有序','同一订单有序，商户内不保证','同一分片内有序'],['适合','商户规模都差不多','只需要订单级顺序','必须按商户分组，但个别商户太大']]},
key:'先看各 Partition 的写入速率和 Key 的分布，找到热点；再在「负载均匀」和「需要的顺序范围」之间选 Key，必要时只给热点 Key 加盐。'},
12:{compareTitle:'常见症状、原因和对策',comparePlain:true,
terms:[
{name:'Lag 只是症状',tone:'prod',tag:'先别急着加实例',what:'Lag 上涨只说明「消费速度 < 写入速度」，原因可能在 Consumer、下游、组的状态或某个 Partition 上。',points:['先看趋势、换算成时间（第 4 课），判断有多紧急。','先定位瓶颈再动手；瓶颈在下游时，加实例只会让下游更挤。'],scene:'本课画面：第一张图加到 8 个实例后，Lag 涨得更快。'},
{name:'排查顺序',tone:'cons',tag:'五步',what:'按这个顺序看，大多数情况都能定位：',points:['① 对比写入速率和消费速率。','② 看各 Partition 的 Lag：一起涨，还是只有个别在涨。','③ 看 Consumer：CPU、单条消息处理耗时、错误和重试。','④ 看下游：数据库 CPU、耗时、连接池、慢查询。','⑤ 看组的状态：Rebalance 次数、成员有没有反复进出。'],scene:'本课画面：监控面板从左到右、从上到下就是这个顺序。'},
{name:'常用工具',tone:'kafka',tag:'从哪里看',what:'这些指标从哪里拿：',points:['<code>kafka-consumer-groups.sh --describe</code>：每个 Partition 的 Lag（第 4 课）。','Consumer 自带的指标：<code>records-lag-max</code>、<code>records-consumed-rate</code>、<code>fetch-latency-avg</code>，接到 Prometheus 等监控系统。','下游数据库的监控和慢查询日志；按「Lag 换算成时间」设告警。'],scene:'本课画面：第二张图下面的监控面板。'}],
compare:{head:['症状','原因','对策','相关课'],rows:[['各 Partition 的 Lag 一起涨，Consumer CPU 高','处理能力不够','加实例（不超过 Partition 数）、优化处理逻辑','第 2 课'],['Lag 涨，Consumer CPU 低，下游耗时高、连接池满','下游瓶颈','优化或扩容下游，必要时限流','第 15 课'],['Lag 锯齿状上涨，Rebalance 次数多','Rebalance 风暴','调 poll 参数、静态成员、Cooperative','第 8 课'],['只有一个 Partition 的 Lag 涨，错误和重试多','坏消息卡住（毒丸）','有限重试 + 死信 Topic','第 14 课'],['只有一个 Partition 的 Lag 涨，它的写入量特别大','热点 Partition','换 Key、拆分热点','第 13 课']]},
key:'Lag 是症状，不是原因：先用监控指标定位瓶颈，再对症处理；只有在 Consumer 处理能力不够时，加实例才有效。'},
11:{compareTitle:'重复从哪里来、谁来挡',comparePlain:true,
terms:[
{name:'自动重试',tone:'prod',tag:'等不到确认就重发',what:'Producer 没收到确认（或收到可重试的错误）就会自动重发。',points:['<code>retries</code> 默认几乎无限（Integer.MAX_VALUE），真正限制总时长的是 <code>delivery.timeout.ms</code>（默认 2 分钟）。','<code>request.timeout.ms</code>：单次请求等多久；<code>retry.backoff.ms</code>：两次重试之间等多久。','超过 delivery.timeout.ms 仍失败，send() 的回调会收到异常，应用必须处理：记录、告警，或交给 Outbox（第 19 课）。','不可重试的错误（比如消息太大，RecordTooLargeException）会直接失败。'],scene:'本课画面：Producer 日志里的「超时 → 自动重试」。'},
{name:'幂等 Producer',tone:'cons',tag:'PID + 序号',what:'<code>enable.idempotence=true</code>，Kafka 3.0 起默认开启，要求 acks=all。',points:['Producer 拿到一个 PID，每个 Partition 的消息带递增的序号；Broker 据此丢弃重复、拒绝跳号。','在 <code>max.in.flight.requests.per.connection</code> ≤ 5 时也能保证顺序。','范围：同一个 Producer 会话、同一个 Partition。Producer 重启后 PID 变了，跨重启的重复挡不住（第 18 课的事务用 transactional.id 解决）。'],scene:'本课画面：第二张图的 PID 和 seq。'},
{name:'max.in.flight',tone:'part',tag:'同时在路上的请求',what:'<code>max.in.flight.requests.per.connection</code>：一个连接上最多同时有几个请求在路上，默认 5。',points:['不开幂等又大于 1 时，前一个请求失败重发，后一个已经写进去了，顺序就乱了（第 10 课）。','以前的办法是设成 1，但吞吐量会下降；现在直接开启幂等就行。'],scene:'本课画面：第一张图的「max.in.flight = 1 / 5」。'},
{name:'协议幂等 ≠ 业务幂等',tone:'kafka',tag:'挡不住应用层重复',what:'幂等 Producer 只认「同一次发送的重试」。',points:['应用代码再调用一次 send()、用户重复点击、服务重启后重放，都是新消息，带新序号，挡不住。','所以 Consumer 端仍然要按 eventId 去重（第 5 课）。'],scene:'本课画面：「应用代码又 send 了一次」。'}],
compare:{head:['重复的来源','幂等 Producer 能挡住吗','靠什么挡'],rows:[['确认丢失后自动重试','能','Broker 按 PID + 序号去重'],['应用代码再调用一次 send()','不能','Consumer 按 eventId 去重（第 5 课）'],['Producer 重启后重发','不能','事务（第 18 课）或 Consumer 去重'],['Consumer 处理完、提交前崩溃','无关','Consumer 幂等（第 5 课）']]},
key:'Producer 协议层的幂等不等于业务幂等：开启幂等能消除重试带来的重复和乱序，但应用层的重复发送仍要靠 eventId 在 Consumer 端去重。'},
10:{compareTitle:'三种写法对比',comparePlain:true,
terms:[
{name:'Message Key',tone:'part',tag:'决定去哪个 Partition',what:'消息可以带一个 Key（比如订单号），Kafka 用它决定写进哪个 Partition。',points:['默认分区规则：<code>hash(key) % Partition 数</code>（murmur2 哈希）。在 Partition 数量和分区规则不变时，相同 Key 会落到相同 Partition；增加 Partition 后，Key 到 Partition 的映射可能改变。','不带 Key：Kafka 2.4 起用 sticky partitioner，一批消息先「粘」在一个 Partition，再换下一个，整体上均匀分散（第 2 课说的「轮流」）。','Key 也会一起存下来，Consumer 能读到。'],scene:'本课画面：第二张图的「Key = orderId」。'},
{name:'顺序保证的范围',tone:'cons',tag:'只在 Partition 内',what:'Kafka 只保证同一个 Partition 内部的顺序。',points:['不同 Partition 之间没有全局顺序，谁先被处理取决于各自的速度。','需要全局顺序只能用 1 个 Partition，代价是失去并行（第 2 课）。','所以「哪些消息之间必须有序」决定了 Key 怎么选。'],scene:'本课画面：红色格子是顺序不对的事件。'},
{name:'Key 怎么选',tone:'kafka',tag:'粗细要刚好',what:'按「哪些消息之间必须有序」来选。',points:['<b>太粗</b>（如事件类型）：同一笔订单被拆开，顺序照样乱；某类事件特别多时还会形成热点 Partition（第 13 课）。','<b>太细或随机</b>（如每条消息一个随机 UUID）：等于没有 Key，顺序没保证。','<b>刚好</b>（订单号、用户 ID）：有序的范围刚好覆盖业务需要，又能分散到多个 Partition。'],scene:'本课画面：第二张图的三种写法。'},
{name:'顺序还会在哪里被破坏',tone:'prod',tag:'三个坑',what:'Key 选对了，下面几处还可能打乱顺序：',points:['<b>扩 Partition：</b><code>hash % N</code> 里的 N 变了，Key 的映射跟着变。','<b>Producer 重试：</b>没开幂等时，重试的批次可能排到后面的批次之后；<code>enable.idempotence=true</code>（3.0 起默认开启）能在重试时保住顺序（第 11 课）。','<b>Consumer 多线程：</b>把同一个 Partition 的消息交给线程池并发处理，完成顺序就乱了；要按 Key 分配线程、同一个 Key 串行处理。'],scene:'本课画面：第二张图的「扩到 4 个 Partition」。'}],
compare:{head:['','不指定 Key','Key = 事件类型','Key = orderId'],rows:[['同一笔订单的事件','分散到不同 Partition','分散到不同 Partition','都在同一个 Partition'],['同一笔订单的顺序','可能乱','可能乱','有保证'],['负载分布','均匀','按事件类型分，容易不均','订单很多时均匀']]},
key:'Kafka 只保证同一个 Partition 内部有序；按「哪些消息之间必须有序」来选 Key，订单级顺序就用 orderId，并且提前预留好 Partition 数。'},
9:{compareTitle:'两种清理策略',comparePlain:true,
terms:[
{name:'Retention',tone:'kafka',tag:'保留多久',what:'Kafka 按规则删除旧消息，和消息有没有被读过无关。',points:['<code>retention.ms</code>：按时间，默认 7 天（Broker 级别是 <code>log.retention.hours=168</code>）。','<code>retention.bytes</code>：按容量，默认 -1 即不限；注意是<b>每个 Partition</b> 的上限。','两个条件满足其一就清理。'],scene:'本课画面：最左边被清空的格子。'},
{name:'Segment 与 log start offset',tone:'part',tag:'整段删',what:'Partition 的日志被切成一段一段的 Segment，清理时整段删除。',points:['正在写的那一段不会被删，所以实际保留时间可能比配置的略长（<code>segment.bytes</code> 默认 1GB，<code>segment.ms</code> 默认 7 天）。','<b>log start offset</b>：最早还在的位置。能读的范围是 [log start offset, LEO)，LEO 见第 4 课。'],scene:'本课画面：灰色的「log start」小旗。'},
{name:'Offset 被清理以后',tone:'prod',tag:'静默丢失',what:'Consumer 提交的位置比 log start offset 还早时：',points:['重启会遇到 <code>OffsetOutOfRange</code>，Kafka 按 <code>auto.offset.reset</code> 跳到最早（earliest）或最新（latest）的位置；Java 默认是 latest（第 16 课）。','不管跳到哪，被清理的消息都回不来，而且不报错。','<code>offsets.retention.minutes</code>（默认 7 天）：组停用太久，它提交的 Offset 本身也会被删。'],scene:'本课画面：第一张图里变红的小旗。'},
{name:'Replay',tone:'cons',tag:'重新读',what:'只要消息还在保留期内，就可以重新读一遍。',points:['<b>新开一个 group.id：</b>从最早开始读，适合新服务补历史。','<b>重置 Offset：</b><code>kafka-consumer-groups.sh --reset-offsets</code>，可以 <code>--to-earliest</code>、<code>--to-datetime</code>、<code>--shift-by</code>；重置前组必须先停止。','<b>代码里调用 <code>seek()</code>：</b>程序自己决定从哪里读。','重放就是再处理一遍，业务必须幂等（第 5 课）。'],scene:'本课画面：第二张图的两个重放按钮。'}],
compare:{head:['','delete（默认）','compact'],rows:[['怎么清理','按时间或容量，整段删除旧 Segment','同一个 Key 只保留最新的一条，旧值被清掉'],['适合','订单、日志这类事件流','「当前状态」类数据，比如用户最新地址'],['配置','cleanup.policy=delete','cleanup.policy=compact（第 21 课 KTable 会用到）']]},
extra:`<div class="rv-formula"><b>保留期该设多长：</b>假设最长可能停机 2 天，恢复后处理速度比写入快一倍、追回积压还要 2 天，那保留期至少要 4 天；再留出余量，设 7 天比较稳妥。监控时把 Lag 换算成时间（第 4 课），接近保留期就该告警。</div>`,
key:'Retention 只看时间和容量，不管消息有没有被读过；保留期要比「最长可能停机的时间 + 追回 Lag 的时间」更长，重放时处理逻辑必须幂等。'},
8:{compareTitle:'Leader 选举 vs Consumer Rebalance',comparePlain:true,
terms:[
{name:'Rebalance',tone:'cons',tag:'重新分配 Partition',what:'同一个 Consumer Group 里，Partition 在实例之间重新分配。什么时候会发生：',points:['<b>新实例加入：</b>扩容、发布上线。','<b>实例正常退出：</b>主动通知 Coordinator，马上开始。','<b>实例崩溃：</b>要等心跳超时才会发现。','<b>处理太慢：</b>两次拉取之间超过 <code>max.poll.interval.ms</code>，被踢出组。','<b>订阅的 Topic 的 Partition 数变了。</b>'],scene:'本课画面：实例徽章上负责的 Partition 在变。'},
{name:'Coordinator 与心跳',tone:'kafka',tag:'谁管这个组',what:'Group Coordinator 是某一台 Broker，负责管理一个 Consumer Group 的成员和分配。',points:['<code>heartbeat.interval.ms</code>（默认 3 秒）：多久发一次心跳。','<code>session.timeout.ms</code>（Kafka 3.0 起默认 45 秒）：多久收不到心跳就判定实例挂了，管的是「活着没有」。','<code>max.poll.interval.ms</code>（默认 5 分钟）：两次拉取的最大间隔，管的是「有没有在干活」；配合 <code>max.poll.records</code>（默认 500 条）。'],scene:'本课画面：右边的 Coordinator 和虚线上的心跳。'},
{name:'Eager 与 Cooperative',tone:'part',tag:'停多少',what:'两种重新分配的方式。',points:['<b>Eager：</b>所有实例先交出全部 Partition，全组停读，再统一分配。','<b>Cooperative（cooperative-sticky）：</b>只移动必须移动的 Partition，其余照常读。','Kafka 4.0 正式推出新的消费组协议（<code>group.protocol=consumer</code>，KIP-848），分配改由服务端计算，不再需要全组停下来同步。'],scene:'本课画面：第二张图的「Eager / Cooperative」切换。'},
{name:'怎样减少 Rebalance',tone:'prod',tag:'实践',what:'少触发、少停读、少重复：',points:['实例正常关闭，让它主动离组，不要直接杀进程。','发布时用静态成员 <code>group.instance.id</code>，短时间重启不触发 Rebalance。','用 <code>cooperative-sticky</code> 分配策略。','处理慢就调小 <code>max.poll.records</code>，或调大 <code>max.poll.interval.ms</code>。','在 <code>onPartitionsRevoked</code> 里先提交 Offset，减少重复处理（第 5 课）。'],scene:'本课画面：第二张图的「静态成员」开关。'}],
compare:{head:['','Leader 选举（第 6、7 课）','Consumer Rebalance（本课）'],rows:[['什么时候发生','Broker 宕机或恢复','Consumer 实例加入、退出、崩溃、处理太慢'],['谁负责','Controller','Group Coordinator'],['换的是什么','Partition 由哪个副本当 Leader','Partition 由哪个 Consumer 实例来读'],['影响','短暂写不进、读不到','这个组暂停读取、Lag 上涨、可能重复处理']]},
extra:`<div class="rv-formula"><b>算一笔账：</b>写入 6,000 条/秒，Eager Rebalance 让全组停读 10 秒，就新增约 60,000 条 Lag。恢复后如果处理速度也只有 6,000 条/秒，这 60,000 条永远追不回来；处理速度要大于写入速度，多出来的部分才是每秒追回的量（第 1、4 课）。</div>`,
key:'Rebalance 会停读：暂停多久 × 写入速度 = 新增的 Lag，之后处理速度必须大于写入速度才能追回来。用 Cooperative、静态成员和合理的 poll 参数，减少 Rebalance 的次数和范围。'},
7:{
terms:[
{name:'ISR',tone:'cons',tag:'保持同步的副本',what:'In-Sync Replicas：和 Leader 保持同步的副本集合，Leader 自己也在里面。',points:['Follower 落后超过 <code>replica.lag.time.max.ms</code>（默认 30 秒）就被踢出 ISR，追上后自动加回。','不只是宕机：磁盘慢、网络抖动也会让 Follower 掉出 ISR。','Leader 宕机时，只从 ISR 里选新 Leader。'],scene:'本课画面：Broker 徽章上的「在 ISR / 掉出 ISR」，终端里的 Isr 列。'},
{name:'acks',tone:'prod',tag:'Producer 配置',what:'Producer 要等多少副本确认，才算写入成功。',points:['<code>acks=0</code>：不等确认，发出去就算。','<code>acks=1</code>：Leader 写进去就算；Follower 还没复制时 Leader 宕机，就会丢。','<code>acks=all</code>（也写作 -1）：等 ISR 里的副本都复制完才算。Kafka 3.0 起这是默认值。','确认丢失后的重试和重复问题，第 11 课讲。'],scene:'本课画面：第一张图是 acks=1，第二张图可以切换。'},
{name:'min.insync.replicas',tone:'part',tag:'ISR 的下限',what:'Topic（或 Broker）级别的配置：acks=all 时，ISR 里至少要有几个副本才允许写入。',points:['只在 <code>acks=all</code> 时生效。acks 配在 Producer 上，它配在 Topic 上，两边都要配。','ISR 不够时，Producer 收到 <code>NotEnoughReplicasException</code>，写入被拒绝。','RF=3 时配 2 最常见；配 3 会导致宕一台就停写。'],scene:'本课画面：第二张图的 minISR 开关。'},
{name:'High Watermark',tone:'kafka',tag:'Consumer 能读到哪',what:'HW：所有 ISR 副本都已复制到的位置。',points:['Consumer 只能读到 HW 之前的消息，还没复制完的消息它看不到。','LEO 是 Leader 下一条要写入的位置（第 4 课），HW ≤ LEO。','所以 Leader 换人时，Consumer 读过的消息一定也在新 Leader 上。'],scene:'本课画面：Leader 格子带上的「HW」小旗。'}],
extra:`<h3 style="margin-top:20px">acks 的三个取值</h3><div class="rv-tablewrap"><table class="rv-table rv-plain"><thead><tr><th>取值</th><th>等谁确认</th><th>速度</th><th>什么时候会丢数据</th></tr></thead><tbody><tr><td>acks=0</td><td>不等</td><td>最快</td><td>网络或 Broker 出任何问题都可能丢</td></tr><tr><td>acks=1</td><td>Leader</td><td>快</td><td>Leader 写入后、Follower 复制前宕机</td></tr><tr><td>acks=all</td><td>ISR 里的全部副本</td><td>稍慢</td><td>ISR 只剩 Leader 时（所以要配 min.insync.replicas）</td></tr></tbody></table></div><h3 style="margin-top:20px">推荐配置和常见坑（RF=3）</h3><div class="rv-tablewrap"><table class="rv-table rv-plain"><thead><tr><th>配置</th><th>1 台 Broker 宕机</th><th>2 台 Broker 宕机</th><th>评价</th></tr></thead><tbody><tr><td>minISR=2 + acks=all</td><td>照常写入</td><td>拒绝写入，保护数据</td><td><b>推荐</b>：不丢已确认的数据</td></tr><tr><td>minISR=1 + acks=all</td><td>照常写入</td><td>照常写入，只剩一份</td><td>剩下那台再坏就丢</td></tr><tr><td>minISR=3 + acks=all</td><td>拒绝写入</td><td>拒绝写入</td><td>宕一台就停写，常见配错</td></tr><tr><td>acks=1</td><td>照常写入</td><td>照常写入</td><td>Leader 刚写入就宕机会丢（第一张图）</td></tr></tbody></table></div><p style="margin:12px 0 0"><b>ISR 全部宕机时：</b><code>unclean.leader.election.enable</code> 默认是 false，落后的副本不能当 Leader，宁可停服也不丢数据；打开它能更快恢复服务，但会丢掉没复制过去的消息。</p>`,
key:'acks=all 等的是 ISR 里的副本，不是所有副本；min.insync.replicas 给 ISR 设下限。推荐 RF=3 + min.insync.replicas=2 + acks=all：能扛住 1 台 Broker 宕机，既不丢已确认的数据，也不停写。'},
6:{compareTitle:'RF=1 和 RF=3',
terms:[
{name:'Broker 与集群',tone:'kafka',tag:'一台 Kafka 服务器',what:'运行 Kafka 的一台服务器叫一个 Broker，多台 Broker 组成一个 Kafka 集群。',points:['Topic 的多个 Partition 分散存放在不同 Broker 上，存储和吞吐量都能随机器数增加，和第 2 课的并行是同一个道理。','客户端的 <code>bootstrap.servers</code> 只用于第一次连接和发现集群：连上其中任意一台，就能拿到整个集群的元数据，之后直接连各个 Broker。建议填多台，避免客户端启动（或重新 bootstrap）时，唯一配置的入口正好不可用。'],scene:'本课画面：中间带机架线的 3 个方块。'},
{name:'Replica 与 RF',tone:'part',tag:'存几份',what:'Replica 是 Partition 的副本；RF（Replication Factor）是每个 Partition 存几份。',points:['同一个 Partition 的副本必须放在不同 Broker 上，所以 RF 不能超过 Broker 数。','RF=3 能扛住 1 台 Broker 宕机，但磁盘和复制流量也变成 3 倍。','生产环境常见 RF=3，第 7 课再配合 <code>min.insync.replicas</code>。'],scene:'本课画面：每台 Broker 上的 3 条小格子带。'},
{name:'Leader 与 Follower',tone:'cons',tag:'谁负责读写',what:'每个 Partition 的几份副本里，只有一份是 Leader。',points:['Producer 和 Consumer 默认只连 Leader。','Follower 只从 Leader 复制数据，平时不对外服务。','Leader 所在 Broker 宕机时，集群里的 Controller 从 Follower 里选出新 Leader。新版本 Kafka 自己负责选举（KRaft），老版本依赖 ZooKeeper。'],scene:'本课画面：带金色小旗的格子带是 Leader。'},
{name:'切换不是瞬间的',tone:'prod',tag:'选举与恢复',what:'Leader 切换有一小段不可用的时间。',points:['这段时间写不进去，Producer 靠重试扛过去（第 11 课）。','Broker 恢复后，上面的副本先当 Follower 把数据补齐；Leader 不会自动换回来，可以手动触发 preferred leader 选举。','RF 不能保证绝对不丢数据：Follower 跟不上 Leader 时怎么办，第 7 课讲。'],scene:'本课画面：「选举中」的提示，以及终端里 Leader 列的变化。'}],
compare:{head:['','RF=1','RF=3'],rows:[['一台 Broker 宕机','它上面的 Partition 不可用，写入失败','Follower 升为 Leader，短暂重试后继续'],['磁盘损坏','数据永久丢失','另外两份还在，可以重建'],['磁盘和复制成本','1 倍','3 倍'],['常见用途','测试环境、丢了也无所谓的数据','生产环境的重要数据']]},
extra:`<h3 style="margin-top:20px">怎么查副本分布</h3><div class="iso-term"><span class="cmd">$ kafka-topics.sh --bootstrap-server localhost:9092 --describe --topic order-events</span>
Topic: order-events  Partition: 0  Leader: 1  Replicas: 1,2,3  Isr: 1,2,3
Topic: order-events  Partition: 1  Leader: 2  Replicas: 2,3,1  Isr: 2,3,1
Topic: order-events  Partition: 2  Leader: 3  Replicas: 3,1,2  Isr: 3,1,2</div><ul style="margin:10px 0 0;padding-left:18px"><li><b>Leader：</b>这个 Partition 当前的 Leader 在哪台 Broker。</li><li><b>Replicas：</b>副本放在哪些 Broker 上，排第一个的是首选 Leader（preferred leader）。</li><li><b>Isr：</b>和 Leader 保持同步的副本，第 7 课细讲。</li></ul>`,
key:'Broker 是存放 Partition 的服务器；RF 决定每个 Partition 存几份，副本必须分散在不同 Broker 上；Leader 负责读写，宕机时由 Follower 接任。RF 越大越安全，成本也越高，而且不能超过 Broker 数。'},
5:{compareTitle:'三种投递语义',
terms:[
{name:'提交方式',tone:'cons',tag:'自动 vs 手动',what:'Consumer 什么时候提交 Offset，决定了崩溃时是重复还是漏掉。',points:['<b>自动提交（默认）：</b><code>enable.auto.commit=true</code>，每隔 <code>auto.commit.interval.ms</code>（默认 5 秒）提交一次已拉取到的位置。','<b>自动提交的坑：</b>把消息交给后台线程异步处理时，可能还没处理完就已经提交了，崩溃就会漏处理。','<b>手动提交：</b>设 <code>enable.auto.commit=false</code>，处理完再调用 <code>commitSync()</code>（等提交结果）或 <code>commitAsync()</code>（不等结果）。'],scene:'本课画面：第 4 课的「每 5 条提交一次」，就类似自动提交的间隔。'},
{name:'幂等的三种做法',tone:'kafka',tag:'重复也不怕',what:'幂等：同一条消息处理一次和处理多次，结果一样。常见做法：',points:['<b>去重表：</b><code>processed_events(event_id 主键)</code>，和业务修改放在同一个数据库事务里。靠唯一约束兜底，不要只「先查有没有、再插入」，两个实例同时处理时会出并发问题。','<b>状态检查：</b>通知状态已经是 SENT 就跳过。','<b>外部幂等键：</b>调用短信等外部接口时带上 eventId，由对方去重。'],scene:'本课画面：第二张图的去重表和短信供应商。'},
{name:'去重 key 怎么选',tone:'part',tag:'eventId',what:'去重要靠一个「同一件事永远相同」的 ID。',points:['<b>推荐：业务 ID。</b>订单号 + 事件类型，或 Producer 写入的 eventId（第 19 课）。','<b>有局限：Partition + Offset。</b>能防同一条记录被重复消费，防不住 Producer 重试写出的两条记录（第 11 课）。','<b>无效：每次处理时随机生成的 UUID。</b>每次都不一样，等于没去重。'],scene:'本课画面：消息上的 eventId，例如 ORD-1042:CREATED。'}],
compare:{head:['','at-most-once（最多一次）','at-least-once（至少一次）','exactly-once（恰好一次）'],rows:[['怎么做','先提交 Offset，再处理','先处理，再提交 Offset','Kafka 事务 + 下游 read_committed（第 18 课）'],['崩溃时','可能漏处理','可能重复处理，需要幂等','处理代码可能重跑，但已提交的输出和 Offset 原子一致，下游看到的结果恰好一次'],['适合','丢一点也无所谓的数据','绝大多数业务','从 Kafka 读、再写回 Kafka 的场景；管不到发短信这类外部操作']]},
extra:`<h3 style="margin-top:20px">先判断：这个操作天然幂等吗？</h3><div class="rv-tablewrap"><table class="rv-table rv-idem"><thead><tr><th>天然幂等（重复执行结果一样）</th><th>不幂等（需要去重）</th></tr></thead><tbody><tr><td>把订单状态设为 PAID</td><td>发短信、发邮件</td></tr><tr><td>按主键覆盖写入（upsert）</td><td>库存减 1、余额扣款</td></tr><tr><td>删除某条记录</td><td>计数器加 1、追加一条流水</td></tr></tbody></table></div><h3 style="margin-top:20px">重复从哪里来</h3><ul style="margin:6px 0 0;padding-left:18px"><li><b>处理完、提交前崩溃：</b>本课。</li><li><b>Rebalance：</b>Partition 换给别的实例后，从已提交的位置重读（第 2、8 课）。</li><li><b>Producer 重试：</b>写入时确认丢了，重试写出了两条记录（第 11 课）。</li></ul>`,
key:'Kafka 默认只能做到「至少一次」：先处理再提交，并让处理逻辑幂等（稳定的 eventId + 去重表 + 外部幂等键），重复消费才不会变成重复业务。'},
4:{
terms:[
{name:'Offset',tone:'part',tag:'消息的编号',what:'消息在某个 Partition 里的编号，从 0 开始，每写入一条加 1。',points:['<b>每个 Partition 各自编号：</b>P0 的 #100 和 P1 的 #100 是两条不同的消息。','只增不减：旧消息被清理后，编号也不会复用（第 9 课）。'],scene:'本课画面：格子下面的数字。'},
{name:'Committed Offset',tone:'cons',tag:'下一条该读谁',what:'某个 Group 在某个 Partition 上提交的位置，表示「下一条该读谁」。',points:['<b>差一位：</b>处理完 #30，提交的是 31。','Kafka 按 Group + Topic + Partition 保存它（内部 Topic <code>__consumer_offsets</code>），所以各组各记各的。','实例重启后只能从这里继续；内存里「已读到」的位置会丢。'],scene:'本课画面：紫色小旗，也就是第 3 课的小旗。'},
{name:'LEO',tag:'Log End Offset',tone:'kafka',what:'这个 Partition 下一条消息将写入的位置，等于最后一条的 Offset + 1。',points:['每写入一条，LEO 加 1。','它和 Group 无关，所有组看到的 LEO 都一样。'],scene:'本课画面：格子带末端的深色标杆。'},
{name:'Lag',tone:'prod',tag:'落后多少',what:'Lag = LEO − Committed Offset：这个组在这个 Partition 上还有多少条没提交。前几课说的「待读取」就是它。',points:['<b>按 Partition 算、按 Group 分开：</b>一个组的总 Lag = 各 Partition 的 Lag 之和。','<b>不完全等于未完成的业务：</b>已处理但还没提交的消息也算在 Lag 里。','<b>换算成时间：</b>Lag ÷ 每秒处理条数 ≈ 延迟秒数。','<b>看趋势：</b>Lag 一直涨，说明处理赶不上写入（第 1、2 课）。'],scene:'本课画面：小旗到标杆之间的橙色格子。'}],
extra:`<div class="rv-formula"><b>一个例子（Partition 0）：</b>已经写入 #0 ～ #44，共 45 条，所以 <code>LEO = 45</code>；notification-group 处理完了 #0 ～ #30，提交的是 <code>31</code>（下一条该读 #31）；所以 <code>Lag = 45 − 31 = 14</code> 条。</div><h3 style="margin-top:20px">怎么看 Lag</h3><div class="iso-term"><span class="cmd">$ kafka-consumer-groups.sh --bootstrap-server localhost:9092 --describe --group notification-group</span>
TOPIC         PARTITION  CURRENT-OFFSET  LOG-END-OFFSET  LAG
order-events  0          31              45              <span class="hl">14</span>
order-events  1          40              44              <span class="hl">4</span></div><ul style="margin:10px 0 0;padding-left:18px"><li><b>按 Partition 看：</b>某一个 Partition 的 Lag 特别大，说明问题集中在它身上（第 13 课的热点 Partition）。</li><li><b>换算成时间：</b>总 Lag 18 条、每秒处理 6 条，用户大约晚收到 3 秒。</li><li><b>看趋势：</b>隔一段时间再查一次，Lag 在涨还是在降，比某一刻的数字更重要。</li></ul>`,
key:'Offset 是消息在 Partition 里的编号；Committed Offset 表示「下一条该读谁」；Lag = LEO − Committed Offset，按 Partition 计算、按 Group 分开，还要换算成时间、看趋势。'},
3:{
terms:[
{name:'Consumer Group',tone:'cons',tag:'一起干活的一组实例',what:'共同读一个 Topic 的一组 Consumer 实例。通常一个服务就是一个 Group。',points:['<b>组内分工：</b>一个 Partition 同一时间只交给组里的一个实例。','<b>组间独立：</b>每个 Group 都会读到 Topic 的全部消息。','组内实例数超过 Partition 数时，多出来的实例空闲（第 2 课）。'],scene:'本课画面：右侧的虚线框，一个框就是一个 Group。第 1 课的三个服务是三个 Group，第 2 课 Notification 的多个实例是一个 Group。'},
{name:'group.id',tone:'part',tag:'组的名字',what:'实例启动时配置的组名。Kafka 只看 group.id 来判断谁和谁是一组。',points:['同一个 group.id：同一组，分工读。','不同 group.id：不同组，各读一份。','<b>配错的后果：</b>两个不同服务用了同一个 group.id，会被当成一组分工，各自都漏掉一部分消息。'],scene:'本课画面：第一张图的事故，就是 Inventory 复制了 Notification 的 group.id。'},
{name:'各组的读取位置',tone:'kafka',tag:'各记各的',what:'每个 Group 各自记住自己在每个 Partition 里读到了哪里。',points:['一个组停下来，不影响其他组继续往前读。','恢复后，从自己记住的位置接着读。','第 4 课会给这个位置一个名字：Offset。'],scene:'本课画面：格子带前面的彩色小旗。'}],
compare:{head:['','同一个 group.id','不同的 group.id'],rows:[['消息怎么分','组内分工，每条只给一个实例','每个组都拿到全部消息'],['某个实例宕机','组内重新分工','其他组不受影响'],['读到哪里','整个组共用一个位置','各组各记各的'],['类比','队列模式（分活干）','发布订阅模式（人手一份）']]},
key:'Kafka 用 group.id 判断：同组分工（每条消息只给组内一个实例），不同组各读一份（每个组都拿到全部消息），每个组各自记录读到哪里。'},
};
function reviewHTML(rv){return `<div class="card rv"><h2><span class="step">04</span> 知识复盘</h2>${rv.pre||''}<div class="rv-grid${rv.terms.length===4?' c2':''}">${rv.terms.map(t=>`<div class="rv-term rv-${t.tone}"><div class="rv-h"><span class="rv-dot"></span><b>${esc(t.name)}</b><span class="rv-tag">${esc(t.tag)}</span></div><p>${esc(t.what)}</p><ul>${t.points.map(x=>`<li>${x}</li>`).join('')}</ul><div class="rv-scene">${esc(t.scene)}</div></div>`).join('')}</div>${rv.compare?`<h3 style="margin-top:20px">${esc(rv.compareTitle||'两张图对比')}</h3><div class="rv-tablewrap"><table class="rv-table${rv.comparePlain?' rv-plain':''}"><thead><tr>${rv.compare.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rv.compare.rows.map(r=>`<tr>${r.map((c,i)=>i?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}${rv.extra||''}<div class="highlight"><strong>本课一句话：</strong>${esc(rv.key)}</div>${rv.quiz===false?`<div class="actions"><span class="sub">本课不设小测试，理解后手动标记完成。</span><button id="markDone" class="btn">${saved[current]===true?'✓ 已完成':'我已理解，标记完成'}</button></div>`:''}</div>`}
function render(){activeScenes.forEach(x=>x.destroy());activeScenes=[];let l=LESSONS[current-1],sc=SCENES[l.n]||{},rv=REVIEWS[l.n],noQuiz=rv&&rv.quiz===false;$('#lesson').innerHTML=`<div class="eyebrow">第 ${l.n} 课 / 共 22 课 · 订单系统场景</div><h1>${esc(l.title)}</h1><p class="lead">${esc(l.problem)}</p><span class="topic">${esc(l.topics)}</span><div class="card"><h2><span class="step">01</span> 故障现场</h2><p>${esc(l.original)}</p>${sc.problem?'<div id="isoProblem"></div>':''}</div><div class="card"><h2><span class="step">02</span> 引入核心机制</h2><p>${esc(l.solution)}</p>${sc.solution?'<div id="isoSolution"></div>':''}</div><div class="card"><h2><span class="step">03</span> 故障模拟与处理边界</h2><p>${esc(l.failure)}</p>${rv?'':`<div class="highlight"><strong>本课一句话：</strong>${esc(l.key)}</div>`}</div>${sc.extra?`<div class="card xc"><h2><span class="step">进阶</span> ${sc.extra.title}</h2><p>${sc.extra.lead}</p><div id="isoExtra"></div><ul class="xc-pts">${sc.extra.points.map(x=>`<li>${x}</li>`).join('')}</ul><div class="highlight"><strong>一句话：</strong>${sc.extra.key}</div></div>`:''}${rv?reviewHTML(rv):''}${noQuiz?'':`<div class="card" id="quiz"><h2><span class="step">${rv?'05':'04'}</span> ${rv?'小测试':'生产故障小测试'}</h2><p><b>${esc(l.question)}</b></p><div class="choices">${l.options.map((o,i)=>`<label class="choice"><input type="radio" name="q" value="${i}"><span>${'ABCD'[i]}. ${esc(o)}</span></label>`).join('')}</div><div class="actions"><button id="check" class="btn" disabled>提交答案</button><button id="show" class="btn secondary">查看解析</button></div><div class="answer" id="answer"></div><div class="print-ans"><b>参考答案：${'ABCD'[l.answer]}. ${esc(l.options[l.answer])}</b><p>${esc(l.explain||l.key)}</p></div></div>`}<div class="actions"><button id="prev" class="btn secondary" ${current===1?'disabled':''}>← 上一课</button><button id="next" class="btn" ${current===22?'disabled':''}>下一课 →</button></div><div class="foot">所有课程已内置此 HTML，离线可用。答题进度保存在本浏览器中。<br>教学内容按原课程重新整理为精简交互版，非逐字原文。</div>`;document.querySelectorAll('input[name=q]').forEach(x=>x.onchange=()=>{$('#check').disabled=false});if($('#check')){$('#check').onclick=()=>grade(false);$('#show').onclick=()=>grade(true)}if($('#markDone'))$('#markDone').onclick=()=>{saved[current]=true;persist();$('#markDone').textContent='✓ 已完成';nav()};$('#prev').onclick=()=>go(current-1);$('#next').onclick=()=>go(current+1);if(sc.problem)activeScenes.push(createIsoScene($('#isoProblem'),sc.problem()));if(sc.solution)activeScenes.push(createIsoScene($('#isoSolution'),sc.solution()));if(sc.extra)activeScenes.push(createIsoScene($('#isoExtra'),sc.extra.scene()));nav()}
function grade(show){let l=LESSONS[current-1],sel=document.querySelector('input[name=q]:checked'),a=$('#answer');if(!show&&!sel)return;let good=show||Number(sel.value)===l.answer;if(!show&&good){saved[current]=true;persist();nav()}a.style.display='block';a.className='answer'+(good?'':' wrong');a.innerHTML=`<strong>${good?'✓ '+(show?'参考答案':'回答正确'):'✕ 这次不正确'}</strong><p>正确答案：${'ABCD'[l.answer]}. ${esc(l.options[l.answer])}</p><p>${esc(l.explain||l.key)}</p>${!show&&!good?'<p>你可以重新选择再提交。</p>':''}`}
function go(n){if(n<1||n>22)return;current=n;history.replaceState(null,'','#'+n);render();window.scrollTo({top:0,behavior:'smooth'});const h=$('#lesson h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}}$('#search').oninput=nav;$('#navToggle').onclick=()=>setNav(!$('#aside').classList.contains('open'));$('#theme').onclick=()=>{document.body.classList.toggle('dark');try{localStorage.setItem('kafka-dark',document.body.classList.contains('dark'))}catch{}};try{if(localStorage.getItem('kafka-dark')==='true')document.body.classList.add('dark')}catch{}$('#reset').onclick=()=>{if(confirm('确定清空这 22 课的答题完成记录吗？')){saved={};persist();render()}};$('#print').onclick=()=>window.print();window.onhashchange=()=>{let n=Number(location.hash.slice(1));if(n>=1&&n<=22&&n!==current){current=n;render()}};render();
</script></body></html>
